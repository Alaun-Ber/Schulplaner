let notenSchuelerId = null;
let notenEditingId = null;

const NOTEN_KATEGORIEN = [
  {key:'lernkontrolle', label:'Lernkontrolle'},
  {key:'klassenarbeit', label:'Klassenarbeiten'},
  {key:'mitarbeit', label:'Allgemeiner Teil'}
];

function renderNoten(){
  const el = document.getElementById('panel-noten');
  if(notenKlasseId && !state.klassen.some(k => k.id === notenKlasseId)) notenKlasseId = null;
  if(!notenKlasseId && state.klassen.length > 0) notenKlasseId = state.klassen[0].id;
  const schuelerDerKlasse = notenKlasseId ? schuelerOfKlasse(notenKlasseId) : [];
  if(notenSchuelerId && !schuelerDerKlasse.some(s => s.id === notenSchuelerId)) notenSchuelerId = null;
  if(!notenSchuelerId && schuelerDerKlasse.length) notenSchuelerId = schuelerDerKlasse[0].id;

  el.innerHTML = `
    <div class="card">
      <h2>Klasse wählen</h2>
      <div class="class-pill-row">
        ${state.klassen.length === 0 ? '<span class="hint">Bitte zunächst unter „Klassen &amp; Schüler" eine Klasse anlegen.</span>' :
          state.klassen.slice().sort((a,b)=>a.name.localeCompare(b.name,'de')).map(k => `
            <span class="class-pill ${k.id===notenKlasseId?'active':''}" onclick="notenKlasseId='${k.id}'; notenSchuelerId=null; renderNoten();">${esc(k.name)}</span>
          `).join('')}
      </div>
    </div>
    ${notenKlasseId ? renderNotenSchuelerAuswahl() + renderNotenDetail() + renderNotenUebersicht() + renderGewichtungCard() : ''}
  `;
}

function renderNotenSchuelerAuswahl(){
  const liste = schuelerOfKlasse(notenKlasseId);
  if(!liste.length) return '';
  return `
    <div class="card no-print">
      <div class="field-row" style="margin-bottom:0;align-items:end;">
        <div class="field grow">
          <label>Schüler:in für Noteneingabe und Bearbeitung auswählen</label>
          <select onchange="notenSchuelerId=this.value;notenEditingId=null;renderNoten()">
            ${liste.map(s=>`<option value="${s.id}" ${s.id===notenSchuelerId?'selected':''}>${esc(s.nachname)}, ${esc(s.vorname)}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>`;
}

function gewichtungFuerKlasse(klasseId){
  const g = state.notenGewichtung[klasseId];
  if(g) return g;
  return {lernkontrolle: 100/3, klassenarbeit: 100/3, mitarbeit: 100/3};
}

function formatProzent(zahl){
  const gerundet = Math.round(zahl * 10) / 10;
  return Number.isInteger(gerundet) ? String(gerundet) : gerundet.toFixed(1).replace('.', ',');
}

function setGewichtung(kategorie, wert){
  const zahl = parseFloat(wert);
  if(!state.notenGewichtung[notenKlasseId]){
    state.notenGewichtung[notenKlasseId] = gewichtungFuerKlasse(notenKlasseId);
  }
  state.notenGewichtung[notenKlasseId][kategorie] = isNaN(zahl) ? 0 : zahl;
  saveState();
  renderNoten();
}

function renderGewichtungCard(){
  const gew = gewichtungFuerKlasse(notenKlasseId);
  const summe = NOTEN_KATEGORIEN.reduce((a,k) => a + (gew[k.key] || 0), 0);
  const summeGerundet = Math.round(summe * 10) / 10;
  const stimmt = Math.abs(summe - 100) < 0.05;
  return `
    <div class="card no-print">
      <h2>Gewichtung der Kategorien — ${esc(klasseName(notenKlasseId))}</h2>
      <p class="hint">Bestimmt, wie stark jede Kategorie in die Endnote einfließt. Die drei Werte sollten in Summe 100 % ergeben.</p>
      <div class="field-row" style="margin-bottom:8px;">
        ${NOTEN_KATEGORIEN.map(k => `
          <div class="field" style="max-width:170px;">
            <label>${esc(k.label)} (%)</label>
            <input type="number" min="0" max="100" step="1" value="${gew[k.key]}" onchange="setGewichtung('${k.key}', this.value)">
          </div>`).join('')}
      </div>
      <p class="hint" style="color:${stimmt ? 'var(--teal)' : 'var(--rose)'}; font-weight:600;">
        Summe: ${formatProzent(summeGerundet)} % ${stimmt ? '✓' : '— sollte 100 % ergeben'}
      </p>
    </div>
  `;
}

function schnittFuer(schuelerId, kategorie){
  const eintraege = state.noten.filter(n => n.schuelerId === schuelerId && n.kategorie === kategorie);
  if(eintraege.length === 0) return null;
  let summeGewicht = 0;
  let summeProdukt = 0;
  eintraege.forEach(n => {
    const g = (n.gewicht === undefined || n.gewicht === null || n.gewicht === '') ? 100 : n.gewicht;
    summeGewicht += g;
    summeProdukt += n.wert * g;
  });
  if(summeGewicht === 0) return null;
  return summeProdukt / summeGewicht;
}

function gesamtSchnitt(schuelerId){
  const alle = state.noten.filter(n => n.schuelerId === schuelerId).map(n => n.wert);
  if(alle.length === 0) return null;
  return alle.reduce((a,b) => a+b, 0) / alle.length;
}

// Endnote = gewichteter Durchschnitt der Kategorie-Schnitte gemäß der eingestellten Gewichtung.
// Kategorien ohne Noten fließen nicht ein; die übrigen Gewichte werden dabei automatisch anteilig genutzt.
function endnoteFuer(schuelerId){
  const gew = gewichtungFuerKlasse(notenKlasseId);
  let summeGewicht = 0;
  let summeProdukt = 0;
  NOTEN_KATEGORIEN.forEach(k => {
    const schnitt = schnittFuer(schuelerId, k.key);
    if(schnitt !== null){
      const w = gew[k.key] || 0;
      summeGewicht += w;
      summeProdukt += schnitt * w;
    }
  });
  if(summeGewicht === 0) return null;
  return summeProdukt / summeGewicht;
}

function formatKomma(zahl, nachkomma){
  if(zahl === null || zahl === undefined) return '—';
  return zahl.toFixed(nachkomma).replace('.', ',');
}

const TENDENZ_NOTEN = ['1+','1','1-','2+','2','2-','3+','3','3-','4+','4','4-','5+','5','5-','6+','6'];

function tendenzWert(note){
  const match = String(note).match(/^([1-6])([+-]?)$/);
  if(!match) return null;
  const basis = Number(match[1]);
  return basis + (match[2] === '+' ? -0.3 : match[2] === '-' ? 0.3 : 0);
}

function notenOptionen(selected, leerErlaubt=true){
  const aktuell = selected == null ? '' : String(selected);
  return `${leerErlaubt?'<option value="">&mdash;</option>':''}${TENDENZ_NOTEN.map(n=>`<option value="${n}" ${aktuell===n?'selected':''}>${n}</option>`).join('')}`;
}

function noteBadge(val, anzeige){
  if(val === null) return '<span class="hint">—</span>';
  const rounded = Math.round(val);
  const text = anzeige || String(Math.round(val * 10) / 10).replace('.', ',');
  return `<span class="grade-cell g${Math.max(1,Math.min(6,rounded))}">${esc(text)}</span>`;
}

// Ermittelt je Kategorie die in der Klasse tatsächlich vergebenen Termine (Datum+Bezeichnung),
// damit sich Schülerinnen und Schüler in einer gemeinsamen Spalte vergleichen lassen.
function notenSpaltenFuerKategorie(klasseId, kategorie){
  const schuelerIds = new Set(schuelerOfKlasse(klasseId).map(s => s.id));
  const eintraege = state.noten.filter(n => schuelerIds.has(n.schuelerId) && n.kategorie === kategorie);
  const map = new Map();
  (state.notenSpalten || []).filter(s => s.klasseId === klasseId && s.kategorie === kategorie).forEach(s => {
    map.set(s.id, {id:s.id, datum:s.datum, bezeichnung:s.bezeichnung, gewicht:s.gewicht});
  });
  eintraege.forEach(n => {
    const key = n.spalteId || ((n.datum || '') + '|' + n.bezeichnung);
    if(!map.has(key)) map.set(key, {id:n.spalteId||'', datum: n.datum, bezeichnung: n.bezeichnung, gewicht:n.gewicht});
  });
  return Array.from(map.values()).sort((a,b) =>
    (a.datum || '').localeCompare(b.datum || '') || a.bezeichnung.localeCompare(b.bezeichnung, 'de')
  );
}

function findeNote(schuelerId, kategorie, spalte){
  return state.noten.find(n => n.schuelerId === schuelerId && n.kategorie === kategorie
    && (spalte.id ? n.spalteId === spalte.id : n.datum === spalte.datum && n.bezeichnung === spalte.bezeichnung));
}

function deleteNotenSpalte(kategorie, datum, bezeichnung, spalteId){
  if(!confirm(`Alle Einträge zu „${bezeichnung}" wirklich für die gesamte Klasse löschen?`)) return;
  const schuelerIds = new Set(schuelerOfKlasse(notenKlasseId).map(s => s.id));
  state.noten = state.noten.filter(n => !(
    schuelerIds.has(n.schuelerId) && n.kategorie === kategorie && (spalteId ? n.spalteId === spalteId : n.datum === datum && n.bezeichnung === bezeichnung)
  ));
  if(spalteId) state.notenSpalten = state.notenSpalten.filter(s => s.id !== spalteId);
  saveState();
  renderNoten();
}

function addNotenSpalte(kategorie){
  const bezEl=document.getElementById(`spalte-bez-${kategorie}`),datumEl=document.getElementById(`spalte-datum-${kategorie}`),gewichtEl=document.getElementById(`spalte-gewicht-${kategorie}`);
  const bezeichnung=bezEl.value.trim(),datum=datumEl.value,gewicht=parseFloat(gewichtEl.value);
  if(!bezeichnung || !datum){alert('Bitte Bezeichnung und Datum angeben.');return;}
  state.notenSpalten.push({id:uid(),klasseId:notenKlasseId,kategorie,bezeichnung,datum,gewicht:isNaN(gewicht)?100:gewicht});
  saveState();renderNoten();
}

function setTabellenNote(schuelerId,kategorie,spalteId,datum,bezeichnung,gewicht,anzeige){
  const spalte={id:spalteId||'',datum,bezeichnung};
  const vorhanden=findeNote(schuelerId,kategorie,spalte);
  if(!anzeige){if(vorhanden)state.noten=state.noten.filter(n=>n.id!==vorhanden.id);saveState();renderNoten();return;}
  const wert=tendenzWert(anzeige);
  if(vorhanden)Object.assign(vorhanden,{anzeige,wert,gewicht:Number(gewicht)||100,spalteId:spalteId||vorhanden.spalteId});
  else state.noten.push({id:uid(),schuelerId,kategorie,spalteId:spalteId||undefined,bezeichnung,datum,anzeige,wert,gewicht:Number(gewicht)||100});
  saveState();renderNoten();
}

function renderNotenUebersicht(){
  const liste = schuelerOfKlasse(notenKlasseId);

  if(liste.length === 0){
    return `<div class="card"><div class="toolbar"><h2 style="margin:0;">Notenübersicht — ${esc(klasseName(notenKlasseId))}</h2></div><div class="empty-state">Keine Schüler:innen in dieser Klasse.</div></div>`;
  }

  const kategorien = NOTEN_KATEGORIEN.map(kat => ({
    kat,
    spalten: notenSpaltenFuerKategorie(notenKlasseId, kat.key)
  }));

  const gewichtung = gewichtungFuerKlasse(notenKlasseId);

  const headerZeile1 = kategorien.map(({kat, spalten}) =>
    `<th colspan="${spalten.length + 1}" class="noten-kat-${kat.key}">${esc(kat.label)} <span style="font-weight:400;">(${formatProzent(gewichtung[kat.key] || 0)} %)</span></th>`
  ).join('');

  const headerZeile2 = kategorien.map(({kat, spalten}) =>
    spalten.map(sp => `<th class="noten-kat-${kat.key}-light">${sp.datum ? formatDatum(sp.datum) : '—'}</th>`).join('') +
    `<th rowspan="2" class="noten-kat-${kat.key}-light">Ø</th>`
  ).join('');

  const headerZeile3 = kategorien.map(({kat, spalten}) =>
    spalten.map(sp => `<th class="noten-kat-${kat.key}-light">
      <span>${esc(sp.bezeichnung)}</span>
      <button class="icon-btn no-print" style="padding:0 0 0 4px;" onclick='deleteNotenSpalte(${JSON.stringify(kat.key)}, ${JSON.stringify(sp.datum)}, ${JSON.stringify(sp.bezeichnung)}, ${JSON.stringify(sp.id||'')})' title="Diese Spalte für die ganze Klasse löschen">✕</button>
    </th>`).join('')
  ).join('');

  const rows = liste.map(s => {
    const zellen = kategorien.map(({kat, spalten}) => {
      const noteZellen = spalten.map(sp => {
        const n = findeNote(s.id, kat.key, sp);
        return `<td class="noten-kat-${kat.key}-light"><select class="no-print" style="width:82px" aria-label="Note für ${esc(s.nachname)}, ${esc(s.vorname)}" onchange='setTabellenNote(${JSON.stringify(s.id)},${JSON.stringify(kat.key)},${JSON.stringify(sp.id||'')},${JSON.stringify(sp.datum||'')},${JSON.stringify(sp.bezeichnung)},${JSON.stringify(sp.gewicht||100)},this.value)'>${notenOptionen(n?(n.anzeige||String(n.wert)):'')}</select><span class="print-only">${n?esc(n.anzeige||n.wert):''}</span></td>`;
      }).join('');
      const schnitt = schnittFuer(s.id, kat.key);
      return noteZellen + `<td class="noten-kat-${kat.key}-light"><strong>${formatKomma(schnitt, 1)}</strong></td>`;
    }).join('');
    const endnote = endnoteFuer(s.id);
    return `<tr>
      <td class="noten-name">${esc(s.nachname)}, ${esc(s.vorname)}</td>
      ${zellen}
      <td class="noten-endnote">${formatKomma(endnote, 2)}</td>
      <td class="no-print"><button class="btn btn-sm btn-outline" onclick="notenSchuelerId='${s.id}'; renderNoten();">Noten verwalten</button></td>
    </tr>`;
  }).join('');

  return `
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;">Notenübersicht — ${esc(klasseName(notenKlasseId))}</h2>
        <div class="filters">
          <button class="btn btn-outline no-print" onclick="exportNotenExcel()">⬇ Excel-Export</button>
          <button class="btn btn-gold no-print" onclick="window.print()">⎙ Drucken</button>
        </div>
      </div>
      <div class="no-print" style="display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));gap:10px;margin:14px 0;">
        ${NOTEN_KATEGORIEN.map(kat=>`<div style="border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper);"><strong>${esc(kat.label)}: neue Spalte</strong><div class="field" style="margin-top:8px"><label>Bezeichnung</label><input id="spalte-bez-${kat.key}" placeholder="z. B. Mitarbeit (mündlich)"></div><div class="field-row" style="margin:8px 0 0"><div class="field"><label>Datum</label><input type="date" id="spalte-datum-${kat.key}" value="${todayISO()}"></div><div class="field" style="max-width:95px"><label>Gewicht %</label><input type="number" id="spalte-gewicht-${kat.key}" min="0" value="100"></div><button class="btn btn-outline" onclick="addNotenSpalte('${kat.key}')">+ Spalte</button></div></div>`).join('')}
      </div>
      <div style="overflow-x:auto;">
      <table class="noten-tabelle">
        <thead>
          <tr>
            <th rowspan="3" class="noten-name">Name, Vorname</th>
            ${headerZeile1}
            <th rowspan="3">Endnote</th>
            <th rowspan="3" class="no-print"></th>
          </tr>
          <tr>${headerZeile2}</tr>
          <tr>${headerZeile3}</tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    </div>
  `;
}

function renderNotenDetail(){
  if(!notenSchuelerId || !state.schueler.some(s => s.id === notenSchuelerId)) return '';
  const s = state.schueler.find(s => s.id === notenSchuelerId);
  return `
    <div class="card no-print">
      <h2>${esc(s.nachname)}, ${esc(s.vorname)} — Einzelnoten</h2>
      ${NOTEN_KATEGORIEN.map(kat => renderNotenKategorie(s.id, kat)).join('')}
    </div>
  `;
}

function renderNotenKategorie(schuelerId, kat){
  const eintraege = state.noten.filter(n => n.schuelerId === schuelerId && n.kategorie === kat.key)
    .sort((a,b) => (a.datum||'').localeCompare(b.datum||''));
  const editing = notenEditingId ? eintraege.find(n => n.id === notenEditingId) : null;
  return `
    <div style="border-top:1px solid var(--line); padding-top:14px; margin-top:14px;">
      <h3 style="font-family:var(--font-head); font-size:15px; margin:0 0 8px 0; color:var(--navy);">${kat.label}</h3>
      ${eintraege.length === 0 ? '<p class="hint">Noch keine Einträge.</p>' : `
      <table style="margin-bottom:10px;">
        <thead><tr><th>Bezeichnung</th><th>Datum</th><th>Note</th><th>Gewichtung</th><th></th></tr></thead>
        <tbody>
          ${eintraege.map(n => `
            <tr>
              <td>${esc(n.bezeichnung)}</td>
              <td>${n.datum ? formatDatum(n.datum) : '—'}</td>
              <td>${noteBadge(n.wert,n.anzeige)}</td>
              <td>
                <input type="number" min="0" step="1" value="${n.gewicht === undefined || n.gewicht === null ? 100 : n.gewicht}" style="width:70px;" onchange="setNoteGewicht('${n.id}', this.value)"> %
              </td>
              <td><button class="icon-btn" onclick="notenEditingId='${n.id}';renderNoten()" title="Bearbeiten">✎</button> <button class="icon-btn" onclick="deleteNote('${n.id}')" title="Löschen">✕</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
      <p class="hint" style="margin-top:-4px;">Die Gewichtung bestimmt, wie stark eine einzelne Note in den Kategorie-Durchschnitt eingeht (z. B. eine wichtige Arbeit mit 20 % gegenüber einer kurzen Kontrolle mit 10 %). Ohne Anpassung zählen alle Noten gleich (je 100 %).</p>`}
      <div class="field-row" style="margin-bottom:0;">
        <div class="field grow">
          <label>Bezeichnung</label>
          <input type="text" id="note-bez-${kat.key}" placeholder="z. B. Test Bruchrechnung" value="${editing?esc(editing.bezeichnung):''}">
        </div>
        <div class="field" style="max-width:100px;">
          <label>Note</label>
          <select id="note-wert-${kat.key}">
            ${notenOptionen(editing?(editing.anzeige||String(editing.wert)):'1',false)}
          </select>
        </div>
        <div class="field" style="max-width:150px;">
          <label>Datum</label>
          <input type="date" id="note-datum-${kat.key}" value="${editing&&editing.datum?editing.datum:''}">
        </div>
        <div class="field" style="max-width:120px;">
          <label>Gewichtung (%)</label>
          <input type="number" min="0" step="1" id="note-gewicht-${kat.key}" value="${editing&&(editing.gewicht!==undefined&&editing.gewicht!==null)?editing.gewicht:100}">
        </div>
        <button class="btn ${editing?'btn-primary':'btn-outline'}" onclick="saveNote('${schuelerId}','${kat.key}')">${editing?'✓ Änderungen speichern':'+ Hinzufügen'}</button>
        ${editing?'<button class="btn btn-outline" onclick="notenEditingId=null;renderNoten()">Abbrechen</button>':''}
      </div>
    </div>
  `;
}

function saveNote(schuelerId, kategorie){
  const bezeichnung = document.getElementById(`note-bez-${kategorie}`).value.trim();
  const anzeige = document.getElementById(`note-wert-${kategorie}`).value;
  const wert = tendenzWert(anzeige);
  const datum = document.getElementById(`note-datum-${kategorie}`).value;
  const gewichtRaw = document.getElementById(`note-gewicht-${kategorie}`).value;
  const gewicht = gewichtRaw === '' ? 100 : parseFloat(gewichtRaw);
  if(!bezeichnung){
    alert('Bitte eine Bezeichnung angeben.');
    return;
  }
  const vorhanden = notenEditingId ? state.noten.find(n => n.id === notenEditingId && n.schuelerId === schuelerId && n.kategorie === kategorie) : null;
  if(vorhanden) Object.assign(vorhanden,{bezeichnung,anzeige,wert,datum,gewicht:isNaN(gewicht)?100:gewicht});
  else state.noten.push({id: uid(), schuelerId, kategorie, bezeichnung, anzeige, wert, datum, gewicht: isNaN(gewicht) ? 100 : gewicht});
  notenEditingId = null;
  saveState();
  renderNoten();
}

function setNoteGewicht(id, wert){
  const note = state.noten.find(n => n.id === id);
  const zahl = parseFloat(wert);
  note.gewicht = isNaN(zahl) ? 100 : zahl;
  saveState();
  renderNoten();
}

function deleteNote(id){
  if(!confirm('Note wirklich löschen?')) return;
  state.noten = state.noten.filter(n => n.id !== id);
  if(notenEditingId === id) notenEditingId = null;
  saveState();
  renderNoten();
}

/* ===================== KOMPETENZRASTER ===================== */

const KR_LEVELS = ['–', 'ansatzweise', 'teilweise', 'sicher'];

  if(aktivesRasterId && !state.kompetenzraster.some(r => r.id === aktivesRasterId)) aktivesRasterId = null;
  if(!aktivesRasterId && state.kompetenzraster.length > 0) aktivesRasterId = state.kompetenzraster[0].id;

  el.innerHTML = `
    <div class="card no-print">
      <h2>Neues Kompetenzraster</h2>
      <p class="hint">Ein Kompetenzraster für eine Klasse anlegen. Jede Zeile im Textfeld wird eine Kompetenz.</p>
      <div class="field-row">
        <div class="field">
          <label>Bezeichnung</label>
          <input type="text" id="krName" placeholder="z. B. Bruchrechnung – Kompetenzraster">
        </div>

          <label>Klasse</label>
          <select id="krKlasse">${klasseOptions()}</select>
        </div>
      </div>
      <div class="field-row">
        <div class="field grow">
          <label>Kompetenzen (eine pro Zeile)</label>
          <textarea id="krKompetenzen" rows="4" placeholder="Ich kann Brüche kürzen.&#10;Ich kann Brüche erweitern.&#10;Ich kann Brüche addieren."></textarea>
        </div>
      </div>
      <button class="btn btn-primary" onclick="createRaster()">+ Kompetenzraster anlegen</button>
    </div>

    ${state.kompetenzraster.length === 0 ? '' : `
    <div class="card no-print">
      <h2>Vorhandene Kompetenzraster</h2>
      <table>
        <thead><tr><th>Bezeichnung</th><th>Klasse</th><th>Kompetenzen</th><th></th></tr></thead>
        <tbody>
          ${state.kompetenzraster.map(r => `
            <tr class="${r.id===aktivesRasterId ? 'edit-row' : ''}">
              <td>${esc(r.name)}</td>
              <td>${esc(klasseName(r.klasseId))}</td>
              <td>${r.kompetenzen.length}</td>
              <td>
                <button class="btn btn-sm btn-outline" onclick="aktivesRasterId='${r.id}'; renderKompetenz();">👁 Anzeigen</button>
                <button class="btn btn-sm btn-outline" onclick="oeffneUndDruckeRaster('${r.id}')">⎙ Drucken</button>
                <button class="btn btn-sm btn-danger" onclick="deleteRaster('${r.id}')">✕ Löschen</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`}

    ${aktivesRasterId ? renderRasterMatrix() : ''}
  `;
}

function createRaster(){
  const name = document.getElementById('krName').value.trim();
  const klasseId = document.getElementById('krKlasse').value;
  const kompetenzen = document.getElementById('krKompetenzen').value.split('\n').map(s => s.trim()).filter(Boolean);
  if(!name || !klasseId || kompetenzen.length === 0){
    alert('Bitte Bezeichnung, Klasse und mindestens eine Kompetenz angeben.');
    return;
  }
  const raster = {id: uid(), name, klasseId, kompetenzen, werte: {}};
  state.kompetenzraster.push(raster);
  aktivesRasterId = raster.id;
  saveState();
  renderKompetenz();
}

function renderRasterMatrix(){
  const raster = state.kompetenzraster.find(r => r.id === aktivesRasterId);
  const liste = schuelerOfKlasse(raster.klasseId);

  if(liste.length === 0){
    return `<div class="card"><div class="empty-state">Für die Klasse „${esc(klasseName(raster.klasseId))}" sind noch keine Schüler:innen angelegt.</div></div>`;
  }

  return `
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;">${esc(raster.name)} — ${esc(klasseName(raster.klasseId))}</h2>
        <div class="filters">
          <button class="btn btn-gold no-print" onclick="window.print()">⎙ Drucken</button>
          <button class="btn btn-danger no-print" onclick="deleteRaster('${raster.id}')">Raster löschen</button>
        </div>
      </div>
      <p class="hint no-print">Klicke auf eine Zelle, um den Status durchzuschalten: – → ansatzweise → teilweise → sicher.</p>
      <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Schüler:in</th>
            ${raster.kompetenzen.map((k,i) => `<th>${esc(k)}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${liste.map(s => {
            if(!raster.werte[s.id]) raster.werte[s.id] = raster.kompetenzen.map(() => 0);
            return `<tr>
              <td>${esc(s.nachname)}, ${esc(s.vorname)}</td>
              ${raster.kompetenzen.map((k,i) => `
                <td class="kr-cell kr-${raster.werte[s.id][i]}" onclick="cycleRasterCell('${raster.id}','${s.id}',${i})">${KR_LEVELS[raster.werte[s.id][i]]}</td>
              `).join('')}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
}

function cycleRasterCell(rasterId, schuelerId, idx){
  const raster = state.kompetenzraster.find(r => r.id === rasterId);
  if(!raster.werte[schuelerId]) raster.werte[schuelerId] = raster.kompetenzen.map(() => 0);
  raster.werte[schuelerId][idx] = (raster.werte[schuelerId][idx] + 1) % KR_LEVELS.length;
  saveState();
  renderKompetenz();
}

function deleteRaster(id){
  if(!confirm('Kompetenzraster wirklich löschen?')) return;
  state.kompetenzraster = state.kompetenzraster.filter(r => r.id !== id);
  aktivesRasterId = null;
  saveState();
  renderKompetenz();
}

function oeffneUndDruckeRaster(id){
  aktivesRasterId = id;
  renderKompetenz();
  setTimeout(() => window.print(), 80);
}

/* ===================== KANNLISTEN ===================== */
let aktiveKannId = null;
let kannBearbeitenModus = false;
// temporärer Formular-Zustand für "Neue Kannliste" (bleibt über Zwischen-Klicks erhalten)
let neueKannName = '';
let neueKannKlasseId = '';
let neueKannBewertungstyp = 'checkbox';
let neueKannItemsSimple = '';
let neueKannItemsStruct = []; // für "3-stufig": [{id, typ:'header'|'item', text, niveau}]

function renderKann(){
  const el = document.getElementById('panel-kann');
  if(aktiveKannId && !state.kannlisten.some(l => l.id === aktiveKannId)) aktiveKannId = null;
  if(!aktiveKannId && state.kannlisten.length > 0) aktiveKannId = state.kannlisten[0].id;

  el.innerHTML = `
    <div class="card no-print">
      <h2>Neue Kann-Liste</h2>
      <p class="hint">Eine digital ausfüllbare Kann-Liste für eine Klasse anlegen.</p>
      <div class="field-row">
        <div class="field">
          <label>Bezeichnung</label>
          <input type="text" id="klName" value="${esc(neueKannName)}" oninput="neueKannName=this.value;" placeholder="z. B. Kann-Liste Uhrzeit lesen">
        </div>
        <div class="field">
          <label>Klasse</label>
          <select id="klKlasse" onchange="neueKannKlasseId=this.value;">${klasseOptions(neueKannKlasseId)}</select>
        </div>
        <div class="field">
          <label>Bewertungsart</label>
          <select id="klBewertungstyp" onchange="neueKannBewertungstyp=this.value; renderKann();">
            <option value="checkbox" ${neueKannBewertungstyp==='checkbox'?'selected':''}>Checkbox (kann / kann noch nicht)</option>
            <option value="dreistufig" ${neueKannBewertungstyp==='dreistufig'?'selected':''}>3-stufig 😊 😐 ☹️ (mit Kategorien &amp; Niveau)</option>
          </select>
        </div>
      </div>

      ${neueKannBewertungstyp === 'dreistufig' ? renderKannBuilderDreistufig() : renderKannBuilderCheckbox()}

      <div class="field-row" style="margin-top:14px; margin-bottom:0;">
        <button class="btn btn-primary" onclick="createKannliste()">+ Kann-Liste erstellen</button>
      </div>
    </div>

    ${state.kannlisten.length === 0 ? '' : `
    <div class="card no-print">
      <h2>Vorhandene Kann-Listen</h2>
      <table>
        <thead><tr><th>Bezeichnung</th><th>Klasse</th><th>Kriterien</th><th></th></tr></thead>
        <tbody>
          ${state.kannlisten.map(l => `
            <tr class="${l.id===aktiveKannId ? 'edit-row' : ''}">
              <td>${esc(l.name)}</td>
              <td>${esc(klasseName(l.klasseId))}</td>
              <td>${l.bewertungstyp === 'dreistufig' ? l.items.filter(i => i.typ === 'item').length : l.items.length}</td>
              <td>
                <button class="btn btn-sm btn-outline" onclick="kannBearbeitenModus=false; aktiveKannId='${l.id}'; renderKann();">👁 Anzeigen</button>
                <button class="btn btn-sm btn-outline" onclick="kannBearbeitenModus=true; aktiveKannId='${l.id}'; renderKann();">✎ Bearbeiten</button>
                <button class="btn btn-sm btn-outline" onclick="oeffneUndDruckeKannliste('${l.id}')">⎙ Drucken</button>
                <button class="btn btn-sm btn-danger" onclick="deleteKannliste('${l.id}')">✕ Löschen</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`}

    ${aktiveKannId ? renderKannMatrix() : ''}
  `;
}

function renderKannBuilderCheckbox(){
  return `
    <div class="field-row">
      <div class="field grow">
        <label>Kriterien (eine pro Zeile)</label>
        <textarea id="klItems" rows="5" oninput="neueKannItemsSimple=this.value;" placeholder="Ich kann die volle Stunde ablesen.&#10;Ich kann die halbe Stunde ablesen.&#10;Ich kann Minuten ablesen.">${esc(neueKannItemsSimple)}</textarea>
      </div>
    </div>`;
}

function renderKannBuilderDreistufig(){
  return `
    <div style="border-top:1px solid var(--line); padding-top:12px; margin-top:4px;">
      <h3 style="font-family:var(--font-head); font-size:15px; margin:0 0 8px 0; color:var(--navy);">Kategorien &amp; Kriterien</h3>
      <p class="hint">Baue die Liste Schritt für Schritt auf: optional zuerst eine Kategorie-Überschrift anlegen, danach die zugehörigen Kriterien mit optionalem Anforderungsniveau (z. B. „2" oder „1-2") hinzufügen.</p>
      ${neueKannItemsStruct.length === 0 ? '<p class="hint">Noch nichts hinzugefügt.</p>' : renderNeueKannVorschau()}
      <div class="field-row">
        <div class="field grow">
          <label>Kategorie (optional, als Überschrift)</label>
          <input type="text" id="kannNeueKategorie" placeholder="z. B. Sachmängel">
        </div>
        <button class="btn btn-outline" onclick="fuegeKannKategorieHinzu()">+ Kategorie hinzufügen</button>
      </div>
      <div class="field-row" style="margin-bottom:0;">
        <div class="field grow">
          <label>Kriterium</label>
          <input type="text" id="kannNeuesKriterium" placeholder="z. B. … Sachmängeln von Rechtsmängeln abgrenzen.">
        </div>
        <div class="field" style="max-width:120px;">
          <label>Niveau (optional)</label>
          <input type="text" id="kannNeuesNiveau" placeholder="z. B. 2">
        </div>
        <button class="btn btn-outline" onclick="fuegeKannKriteriumHinzu()">+ Kriterium hinzufügen</button>
      </div>
    </div>`;
}

function renderNeueKannVorschau(){
  return `
    <div style="border:1px solid var(--line); border-radius:var(--radius); padding:8px; margin-bottom:12px;">
      ${neueKannItemsStruct.map((it,i) => {
        if(it.typ === 'header'){
          return `
            <div class="kl-kategorie" style="border-radius:4px; display:flex; justify-content:space-between; align-items:center; margin:${i===0?'0':'8px'} 0 4px 0;">
              <span>${esc(it.text)}</span>
              <button class="icon-btn" style="color:#fff;" onclick="entferneNeuesKannItem(${i})" title="Entfernen">✕</button>
            </div>`;
        }
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:5px 8px; font-size:13px; border-bottom:1px solid var(--line);">
            <span>${esc(it.text)} ${it.niveau ? `<span class="badge badge-gray">Niveau ${esc(it.niveau)}</span>` : ''}</span>
            <button class="icon-btn" onclick="entferneNeuesKannItem(${i})" title="Entfernen">✕</button>
          </div>`;
      }).join('')}
    </div>`;
}

function fuegeKannKategorieHinzu(){
  const input = document.getElementById('kannNeueKategorie');
  const text = input.value.trim();
  if(!text){
    alert('Bitte einen Kategorienamen angeben.');
    return;
  }
  neueKannItemsStruct.push({id: uid(), typ: 'header', text});
  renderKann();
}

function fuegeKannKriteriumHinzu(){
  const textInput = document.getElementById('kannNeuesKriterium');
  const niveauInput = document.getElementById('kannNeuesNiveau');
  const text = textInput.value.trim();
  const niveau = niveauInput.value.trim();
  if(!text){
    alert('Bitte einen Kriterientext angeben.');
    return;
  }
  neueKannItemsStruct.push({id: uid(), typ: 'item', text, niveau});
  renderKann();
}

function entferneNeuesKannItem(index){
  neueKannItemsStruct.splice(index, 1);
  renderKann();
}

function createKannliste(){
  const name = document.getElementById('klName').value.trim();
  const klasseId = document.getElementById('klKlasse').value;
  const bewertungstyp = document.getElementById('klBewertungstyp').value;

  let items;
  if(bewertungstyp === 'dreistufig'){
    items = neueKannItemsStruct;
  } else {
    items = document.getElementById('klItems').value.split('\n').map(s => s.trim()).filter(Boolean);
  }
  const anzahlKriterien = bewertungstyp === 'dreistufig' ? items.filter(i => i.typ === 'item').length : items.length;

  if(!name || !klasseId || anzahlKriterien === 0){
    alert('Bitte Bezeichnung, Klasse und mindestens ein Kriterium angeben.');
    return;
  }

  const liste = {id: uid(), name, klasseId, bewertungstyp, items, werte: {}};
  state.kannlisten.push(liste);
  aktiveKannId = liste.id;
  aktiverKannSchuelerId = null;

  // Formular-Zustand zurücksetzen
  neueKannName = '';
  neueKannKlasseId = '';
  neueKannBewertungstyp = 'checkbox';
  neueKannItemsSimple = '';
  neueKannItemsStruct = [];

  saveState();
  renderKann();
}

let aktiverKannSchuelerId = null;

function renderKannMatrix(){
  const liste = state.kannlisten.find(l => l.id === aktiveKannId);

  if(kannBearbeitenModus){
    return renderKannBearbeitenCard(liste);
  }

  const schueler = schuelerOfKlasse(liste.klasseId);

  if(schueler.length === 0){
    return `<div class="card"><div class="empty-state">Für die Klasse „${esc(klasseName(liste.klasseId))}" sind noch keine Schüler:innen angelegt.</div></div>`;
  }

  if(liste.bewertungstyp === 'dreistufig'){
    return renderKannArbeitsblatt(liste, schueler);
  }

  return `
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;">${esc(liste.name)} — ${esc(klasseName(liste.klasseId))}</h2>
        <div class="filters">
          <button class="btn btn-outline no-print" onclick="exportKannMatrixWord('${liste.id}')">⬇ Word-Export</button>
          <button class="btn btn-gold no-print" onclick="window.print()">⎙ Drucken</button>
          <button class="btn btn-danger no-print" onclick="deleteKannliste('${liste.id}')">Kann-Liste löschen</button>
        </div>
      </div>
      <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Schüler:in</th>
            ${liste.items.map(i => `<th>${esc(i)}</th>`).join('')}
            <th>Fortschritt</th>
          </tr>
        </thead>
        <tbody>
          ${schueler.map(s => {
            if(!liste.werte[s.id]) liste.werte[s.id] = liste.items.map(() => false);
            const anzahlErf = liste.werte[s.id].filter(Boolean).length;
            const pct = Math.round((anzahlErf / liste.items.length) * 100);
            return `<tr>
              <td>${esc(s.nachname)}, ${esc(s.vorname)}</td>
              ${liste.items.map((it,i) => `
                <td style="text-align:center;">
                  <input type="checkbox" class="kl-check" ${liste.werte[s.id][i] ? 'checked' : ''}
                    onchange="toggleKannItem('${liste.id}','${s.id}',${i})">
                </td>
              `).join('')}
              <td style="min-width:120px;">
                <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
                <span class="hint">${anzahlErf}/${liste.items.length}</span>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
}

function renderKannArbeitsblatt(liste, schueler){
  if(aktiverKannSchuelerId && !schueler.some(s => s.id === aktiverKannSchuelerId)) aktiverKannSchuelerId = null;
  if(!aktiverKannSchuelerId) aktiverKannSchuelerId = schueler[0].id;
  const aktuellerSchueler = schueler.find(s => s.id === aktiverKannSchuelerId);

  const nurItems = liste.items.filter(i => i.typ === 'item');
  const werteSchueler = liste.werte[aktiverKannSchuelerId] || {};
  const anzahlBewertet = nurItems.filter(i => werteSchueler[i.id]).length;

  let laufendeNr = 0;

  return `
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;">${esc(liste.name)} — ${esc(klasseName(liste.klasseId))}</h2>
        <div class="filters">
          <button class="btn btn-outline no-print" onclick="exportKannArbeitsblattWord('${liste.id}','${aktiverKannSchuelerId}')">⬇ Word-Export</button>
          <button class="btn btn-gold no-print" onclick="window.print()">⎙ Drucken</button>
          <button class="btn btn-danger no-print" onclick="deleteKannliste('${liste.id}')">Kann-Liste löschen</button>
        </div>
      </div>
      <div class="no-print" style="margin-bottom:14px;">
        <label class="hint" style="display:block; margin-bottom:4px;">Schüler:in auswählen</label>
        <select onchange="aktiverKannSchuelerId=this.value; renderKann();" style="max-width:280px;">
          ${schueler.map(s => `<option value="${s.id}" ${s.id===aktiverKannSchuelerId?'selected':''}>${esc(s.nachname)}, ${esc(s.vorname)}</option>`).join('')}
        </select>
        <span class="hint" style="margin-left:10px;">${anzahlBewertet}/${nurItems.length} bewertet</span>
      </div>

      <div class="kl-arbeitsblatt-kopf">
        <div><strong>Name:</strong> ${esc(aktuellerSchueler.nachname)}, ${esc(aktuellerSchueler.vorname)}</div>
        <div><strong>Klasse:</strong> ${esc(klasseName(liste.klasseId))}</div>
        <div><strong>Datum:</strong> ${formatDatum(todayISO())}</div>
      </div>

      <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th style="width:36px;">Nr.</th>
            <th>Ich kann …</th>
            <th style="width:70px;">Niveau</th>
            <th style="width:56px;" title="gut">😊</th>
            <th style="width:56px;" title="mittel">😐</th>
            <th style="width:56px;" title="schlecht">☹️</th>
          </tr>
        </thead>
        <tbody>
          ${liste.items.map(item => {
            if(item.typ === 'header'){
              return `<tr><td colspan="6" class="kl-kategorie">${esc(item.text)}</td></tr>`;
            }
            laufendeNr++;
            const wert = werteSchueler[item.id] || null;
            return `
              <tr>
                <td style="text-align:center;">${laufendeNr}.</td>
                <td>${esc(item.text)}</td>
                <td style="text-align:center;">${item.niveau ? esc(item.niveau) : '<span class="hint">—</span>'}</td>
                ${['gut','mittel','schlecht'].map(stufe => `
                  <td style="text-align:center;">
                    <button class="kl-rate-btn kl-rate-${stufe} ${wert===stufe?'aktiv':''}" onclick="setDreistufigWert('${liste.id}','${aktiverKannSchuelerId}','${item.id}','${stufe}')"></button>
                  </td>`).join('')}
              </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
}

function toggleKannItem(listeId, schuelerId, idx){
  const liste = state.kannlisten.find(l => l.id === listeId);
  if(!liste.werte[schuelerId]) liste.werte[schuelerId] = liste.items.map(() => false);
  liste.werte[schuelerId][idx] = !liste.werte[schuelerId][idx];
  saveState();
}

function setDreistufigWert(listeId, schuelerId, itemId, stufe){
  const liste = state.kannlisten.find(l => l.id === listeId);
  if(!liste.werte[schuelerId]) liste.werte[schuelerId] = {};
  liste.werte[schuelerId][itemId] = (liste.werte[schuelerId][itemId] === stufe) ? null : stufe;
  saveState();
  renderKann();
}

function renderKannBearbeitenCard(liste){
  const inhalt = liste.bewertungstyp === 'dreistufig'
    ? renderKannBearbeitenDreistufig(liste)
    : renderKannBearbeitenCheckbox(liste);

  return `
    <div class="card no-print">
      <div class="toolbar">
        <h2 style="margin:0;">Kann-Liste bearbeiten</h2>
        <button class="btn btn-outline" onclick="kannBearbeitenModus=false; renderKann();">✓ Fertig</button>
      </div>
      <div class="field-row">
        <div class="field grow">
          <label>Bezeichnung</label>
          <input type="text" value="${esc(liste.name)}" onchange="umbenennenKannliste('${liste.id}', this.value)">
        </div>
        <div class="field">
          <label>Klasse</label>
          <input type="text" value="${esc(klasseName(liste.klasseId))}" disabled style="background:#F0F0F0; color:var(--ink-soft);">
        </div>
      </div>
      <p class="hint" style="margin-top:-6px;">Die Klasse kann nachträglich nicht geändert werden (sonst gehen bereits eingetragene Bewertungen durcheinander). Lege bei Bedarf eine neue Liste für eine andere Klasse an.</p>
      ${inhalt}
    </div>`;
}

function renderKannBearbeitenCheckbox(liste){
  return `
    <div style="border-top:1px solid var(--line); padding-top:12px; margin-top:8px;">
      <h3 style="font-family:var(--font-head); font-size:15px; margin:0 0 8px 0; color:var(--navy);">Kriterien</h3>
      ${liste.items.length === 0 ? '<p class="hint">Noch keine Kriterien.</p>' : liste.items.map((text, idx) => `
        <div class="field-row" style="align-items:center;">
          <div class="field grow">
            <input type="text" value="${esc(text)}" onchange="umbenennenKannItemCheckbox('${liste.id}', ${idx}, this.value)">
          </div>
          <button class="icon-btn" onclick="entferneKannItemCheckbox('${liste.id}', ${idx})" title="Kriterium löschen">✕</button>
        </div>`).join('')}
      <div class="field-row" style="margin-top:8px; margin-bottom:0;">
        <div class="field grow">
          <label>Neues Kriterium</label>
          <input type="text" id="kannBearbeitenNeuesItem_${liste.id}" placeholder="z. B. Ich kann Minuten ablesen.">
        </div>
        <button class="btn btn-outline" onclick="fuegeKannItemCheckboxHinzu('${liste.id}')">+ Hinzufügen</button>
      </div>
    </div>`;
}

function renderKannBearbeitenDreistufig(liste){
  return `
    <div style="border-top:1px solid var(--line); padding-top:12px; margin-top:8px;">
      <h3 style="font-family:var(--font-head); font-size:15px; margin:0 0 8px 0; color:var(--navy);">Kategorien &amp; Kriterien</h3>
      ${liste.items.length === 0 ? '<p class="hint">Noch nichts hinzugefügt.</p>' : liste.items.map(it => {
        if(it.typ === 'header'){
          return `
            <div class="field-row" style="align-items:center; margin-top:10px;">
              <div class="field grow">
                <input type="text" value="${esc(it.text)}" style="font-weight:700; background:var(--gold-light);" onchange="umbenennenKannItemDreistufig('${liste.id}','${it.id}','text', this.value)">
              </div>
              <button class="icon-btn" onclick="entferneKannItemDreistufig('${liste.id}','${it.id}')" title="Kategorie löschen">✕</button>
            </div>`;
        }
        return `
          <div class="field-row" style="align-items:center;">
            <div class="field grow">
              <input type="text" value="${esc(it.text)}" onchange="umbenennenKannItemDreistufig('${liste.id}','${it.id}','text', this.value)">
            </div>
            <div class="field" style="max-width:100px;">
              <input type="text" value="${esc(it.niveau || '')}" placeholder="Niveau" onchange="umbenennenKannItemDreistufig('${liste.id}','${it.id}','niveau', this.value)">
            </div>
            <button class="icon-btn" onclick="entferneKannItemDreistufig('${liste.id}','${it.id}')" title="Kriterium löschen">✕</button>
          </div>`;
      }).join('')}

      <div class="field-row" style="margin-top:14px;">
        <div class="field grow">
          <label>Neue Kategorie (optional, als Überschrift)</label>
          <input type="text" id="kannBearbeitenNeueKategorie_${liste.id}" placeholder="z. B. Sachmängel">
        </div>
        <button class="btn btn-outline" onclick="fuegeKannKategorieBearbeitenHinzu('${liste.id}')">+ Kategorie hinzufügen</button>
      </div>
      <div class="field-row" style="margin-bottom:0;">
        <div class="field grow">
          <label>Neues Kriterium</label>
          <input type="text" id="kannBearbeitenNeuesKriterium_${liste.id}" placeholder="z. B. … Sachmängeln von Rechtsmängeln abgrenzen.">
        </div>
        <div class="field" style="max-width:120px;">
          <label>Niveau (optional)</label>
          <input type="text" id="kannBearbeitenNeuesNiveau_${liste.id}" placeholder="z. B. 2">
        </div>
        <button class="btn btn-outline" onclick="fuegeKannKriteriumBearbeitenHinzu('${liste.id}')">+ Kriterium hinzufügen</button>
      </div>
    </div>`;
}

function umbenennenKannliste(id, name){
  const liste = state.kannlisten.find(l => l.id === id);
  const trimmed = name.trim();
  if(!trimmed){ alert('Die Bezeichnung darf nicht leer sein.'); renderKann(); return; }
  liste.name = trimmed;
  saveState();
  renderKann();
}

/* --- Checkbox-Kannlisten bearbeiten --- */
function umbenennenKannItemCheckbox(listId, idx, text){
  const liste = state.kannlisten.find(l => l.id === listId);
  const trimmed = text.trim();
  if(!trimmed){ alert('Das Kriterium darf nicht leer sein.'); renderKann(); return; }
  liste.items[idx] = trimmed;
  saveState();
  renderKann();
}

function fuegeKannItemCheckboxHinzu(listId){
  const liste = state.kannlisten.find(l => l.id === listId);
  const input = document.getElementById(`kannBearbeitenNeuesItem_${listId}`);
  const text = input.value.trim();
  if(!text){ alert('Bitte ein Kriterium angeben.'); return; }
  liste.items.push(text);
  // bestehende Bewertungen aller Schüler:innen um den neuen (noch unbewerteten) Punkt erweitern
  Object.values(liste.werte).forEach(arr => { if(Array.isArray(arr)) arr.push(false); });
  saveState();
  renderKann();
}

function entferneKannItemCheckbox(listId, idx){
  if(!confirm('Dieses Kriterium inkl. aller eingetragenen Haken wirklich löschen?')) return;
  const liste = state.kannlisten.find(l => l.id === listId);
  liste.items.splice(idx, 1);
  Object.values(liste.werte).forEach(arr => { if(Array.isArray(arr)) arr.splice(idx, 1); });
  saveState();
  renderKann();
}

/* --- 3-stufige Kannlisten bearbeiten --- */
function umbenennenKannItemDreistufig(listId, itemId, feld, wert){
  const liste = state.kannlisten.find(l => l.id === listId);
  const item = liste.items.find(i => i.id === itemId);
  if(feld === 'text'){
    const trimmed = wert.trim();
    if(!trimmed){ alert('Der Text darf nicht leer sein.'); renderKann(); return; }
    item.text = trimmed;
  } else {
    item.niveau = wert.trim();
  }
  saveState();
  renderKann();
}

function fuegeKannKategorieBearbeitenHinzu(listId){
  const liste = state.kannlisten.find(l => l.id === listId);
  const input = document.getElementById(`kannBearbeitenNeueKategorie_${listId}`);
  const text = input.value.trim();
  if(!text){ alert('Bitte einen Kategorienamen angeben.'); return; }
  liste.items.push({id: uid(), typ: 'header', text});
  saveState();
  renderKann();
}

function fuegeKannKriteriumBearbeitenHinzu(listId){
  const liste = state.kannlisten.find(l => l.id === listId);
  const textInput = document.getElementById(`kannBearbeitenNeuesKriterium_${listId}`);
  const niveauInput = document.getElementById(`kannBearbeitenNeuesNiveau_${listId}`);
  const text = textInput.value.trim();
  const niveau = niveauInput.value.trim();
  if(!text){ alert('Bitte einen Kriterientext angeben.'); return; }
  liste.items.push({id: uid(), typ: 'item', text, niveau});
  saveState();
  renderKann();
}

function entferneKannItemDreistufig(listId, itemId){
  if(!confirm('Diesen Eintrag wirklich löschen? Bereits erfasste Bewertungen dazu gehen verloren.')) return;
  const liste = state.kannlisten.find(l => l.id === listId);
  liste.items = liste.items.filter(i => i.id !== itemId);
  Object.values(liste.werte).forEach(w => delete w[itemId]);
  saveState();
  renderKann();
}

function deleteKannliste(id){
  if(!confirm('Kann-Liste wirklich löschen?')) return;
  state.kannlisten = state.kannlisten.filter(l => l.id !== id);
  aktiveKannId = null;
  kannBearbeitenModus = false;
  saveState();
  renderKann();
}

function oeffneUndDruckeKannliste(id){
  aktiveKannId = id;
  kannBearbeitenModus = false;
  renderKann();
  setTimeout(() => window.print(), 80);
}

/* ===================== KLASSENLISTEN (frei definierbar) ===================== */
let aktiveKlassenlisteId = null;
// temporärer Formular-Zustand für die "Neue Klassenliste"-Karte (bleibt über Spalten-Hinzufügen erhalten)
let neueKlName = '';
let neueKlKlasseId = '';
let neueKlSpalten = [];

function spaltenTypLabel(typ){
  return {checkbox: 'Checkbox', note: 'Note', text: 'Text'}[typ] || typ;
}

function renderKlassenlisten(){
  const el = document.getElementById('panel-klassenlisten');
  if(!el) return;

  el.innerHTML = `
    <div class="card no-print">
      <h2>Neue Klassenliste</h2>
      <p class="hint">Erstelle eine frei definierbare Liste für eine Klasse — die Schüler:innen werden automatisch übernommen. Lege beliebig viele Spalten an und wähle je Spalte den Zelltyp: Checkbox, Note oder Text (z. B. für Bemerkungen).</p>
      <div class="field-row">
        <div class="field">
          <label>Bezeichnung</label>
          <input type="text" id="klListeName" value="${esc(neueKlName)}" oninput="neueKlName=this.value;" placeholder="z. B. Materialkontrolle 1. Halbjahr">
        </div>
        <div class="field">
          <label>Klasse</label>
          <select id="klListeKlasse" onchange="neueKlKlasseId=this.value;">${klasseOptions(neueKlKlasseId)}</select>
        </div>
      </div>
      <div style="border-top:1px solid var(--line); padding-top:12px; margin-top:4px;">
        <h3 style="font-family:var(--font-head); font-size:15px; margin:0 0 8px 0; color:var(--navy);">Spalten</h3>
        ${neueKlSpalten.length === 0 ? '<p class="hint">Noch keine Spalten hinzugefügt.</p>' : `
          <div class="class-pill-row">
            ${neueKlSpalten.map((s,i) => `
              <span class="class-pill" style="cursor:default;">
                ${esc(s.name)} <span class="badge badge-teal">${spaltenTypLabel(s.typ)}</span>
                <button class="icon-btn" onclick="entferneNeueSpalte(${i})" title="Entfernen">✕</button>
              </span>`).join('')}
          </div>`}
        <div class="field-row" style="margin-top:10px; margin-bottom:0;">
          <div class="field grow">
            <label>Spaltenname</label>
            <input type="text" id="klSpaltenName" placeholder="z. B. Bemerkung, Hausaufgabe erledigt, Test 1">
          </div>
          <div class="field" style="max-width:160px;">
            <label>Zelltyp</label>
            <select id="klSpaltenTyp">
              <option value="checkbox">Checkbox</option>
              <option value="note">Note</option>
              <option value="text">Text</option>
            </select>
          </div>
          <button class="btn btn-outline" onclick="fuegeNeueSpalteHinzu()">+ Spalte hinzufügen</button>
        </div>
      </div>
      <div class="field-row" style="margin-top:14px; margin-bottom:0;">
        <button class="btn btn-primary" onclick="erstelleKlassenliste()">+ Klassenliste erstellen</button>
      </div>
    </div>

    ${state.klassenlisten.length === 0 ? '' : `
    <div class="card no-print">
      <h2>Vorhandene Klassenlisten</h2>
      <table>
        <thead><tr><th>Bezeichnung</th><th>Klasse</th><th>Spalten</th><th></th></tr></thead>
        <tbody>
          ${state.klassenlisten.map(l => `
            <tr class="${l.id===aktiveKlassenlisteId ? 'edit-row' : ''}">
              <td>${esc(l.name)}</td>
              <td>${esc(klasseName(l.klasseId))}</td>
              <td>${l.spalten.length}</td>
              <td>
                <button class="btn btn-sm btn-outline" onclick="aktiveKlassenlisteId='${l.id}'; renderKlassenlisten();">👁 Anzeigen</button>
                <button class="btn btn-sm btn-outline" onclick="oeffneUndDruckeKlassenliste('${l.id}')">⎙ Drucken</button>
                <button class="btn btn-sm btn-danger" onclick="deleteKlassenliste('${l.id}')">✕ Löschen</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`}

    ${aktiveKlassenlisteId ? renderKlassenlisteMatrix() : ''}
  `;
}

function fuegeNeueSpalteHinzu(){
  const nameInput = document.getElementById('klSpaltenName');
  const typInput = document.getElementById('klSpaltenTyp');
  const name = nameInput.value.trim();
  const typ = typInput.value;
  if(!name){
    alert('Bitte einen Spaltennamen angeben.');
    return;
  }
  neueKlSpalten.push({id: uid(), name, typ});
  renderKlassenlisten();
}

function entferneNeueSpalte(index){
  neueKlSpalten.splice(index, 1);
  renderKlassenlisten();
}

function erstelleKlassenliste(){
  const name = document.getElementById('klListeName').value.trim();
  const klasseId = document.getElementById('klListeKlasse').value;
  if(!name || !klasseId){
    alert('Bitte Bezeichnung und Klasse angeben.');
    return;
  }
  if(neueKlSpalten.length === 0){
    alert('Bitte mindestens eine Spalte hinzufügen.');
    return;
  }
  const liste = {id: uid(), name, klasseId, spalten: neueKlSpalten, werte: {}};
  state.klassenlisten.push(liste);
  aktiveKlassenlisteId = liste.id;
  neueKlName = '';
  neueKlKlasseId = '';
  neueKlSpalten = [];
  saveState();
  renderKlassenlisten();
}

function renderKlassenlisteMatrix(){
  const liste = state.klassenlisten.find(l => l.id === aktiveKlassenlisteId);
  const schueler = schuelerOfKlasse(liste.klasseId);

  if(schueler.length === 0){
    return `<div class="card"><div class="empty-state">Für die Klasse „${esc(klasseName(liste.klasseId))}" sind noch keine Schüler:innen angelegt.</div></div>`;
  }

  return `
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;">${esc(liste.name)} — ${esc(klasseName(liste.klasseId))}</h2>
        <div class="filters">
          <button class="btn btn-gold no-print" onclick="window.print()">⎙ Drucken</button>
          <button class="btn btn-danger no-print" onclick="deleteKlassenliste('${liste.id}')">Liste löschen</button>
        </div>
      </div>
      <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Schüler:in</th>
            ${liste.spalten.map(sp => `
              <th>${esc(sp.name)} <span class="hint">(${spaltenTypLabel(sp.typ)})</span>
                <button class="icon-btn no-print" onclick="entferneSpalteAusListe('${liste.id}','${sp.id}')" title="Spalte löschen">✕</button>
              </th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${schueler.map(s => `
            <tr>
              <td>${esc(s.nachname)}, ${esc(s.vorname)}</td>
              ${liste.spalten.map(sp => `<td style="text-align:${sp.typ==='text'?'left':'center'}; min-width:110px;">${renderKlassenlisteZelle(liste, s.id, sp)}</td>`).join('')}
            </tr>`).join('')}
        </tbody>
      </table>
      </div>
      <div class="field-row no-print" style="margin-top:14px; margin-bottom:0;">
        <div class="field grow">
          <label>Weitere Spalte zu dieser Liste hinzufügen</label>
          <input type="text" id="klNeueSpalteName_${liste.id}" placeholder="Spaltenname">
        </div>
        <div class="field" style="max-width:160px;">
          <label>Zelltyp</label>
          <select id="klNeueSpalteTyp_${liste.id}">
            <option value="checkbox">Checkbox</option>
            <option value="note">Note</option>
            <option value="text">Text</option>
          </select>
        </div>
        <button class="btn btn-outline" onclick="fuegeSpalteZuListeHinzu('${liste.id}')">+ Spalte hinzufügen</button>
      </div>
    </div>
  `;
}

function renderKlassenlisteZelle(liste, schuelerId, spalte){
  if(!liste.werte[schuelerId]) liste.werte[schuelerId] = {};
  const wert = liste.werte[schuelerId][spalte.id];

  if(spalte.typ === 'checkbox'){
    return `<input type="checkbox" class="kl-check" ${wert ? 'checked' : ''} onchange="setKlassenlisteZelle('${liste.id}','${schuelerId}','${spalte.id}', this.checked)">`;
  }
  if(spalte.typ === 'note'){
    return `
      <select onchange="setKlassenlisteZelle('${liste.id}','${schuelerId}','${spalte.id}', this.value ? parseInt(this.value,10) : null)">
        <option value="">—</option>
        ${[1,2,3,4,5,6].map(n => `<option value="${n}" ${wert===n?'selected':''}>${n}</option>`).join('')}
      </select>`;
  }
  // Text
  return `<input type="text" style="width:100%;" value="${esc(wert || '')}" placeholder="—" onchange="setKlassenlisteZelle('${liste.id}','${schuelerId}','${spalte.id}', this.value)">`;
}

function setKlassenlisteZelle(listId, schuelerId, spaltenId, wert){
  const liste = state.klassenlisten.find(l => l.id === listId);
  if(!liste.werte[schuelerId]) liste.werte[schuelerId] = {};
  liste.werte[schuelerId][spaltenId] = wert;
  saveState();
}

function fuegeSpalteZuListeHinzu(listId){
  const liste = state.klassenlisten.find(l => l.id === listId);
  const nameInput = document.getElementById(`klNeueSpalteName_${listId}`);
  const typInput = document.getElementById(`klNeueSpalteTyp_${listId}`);
  const name = nameInput.value.trim();
  const typ = typInput.value;
  if(!name){
    alert('Bitte einen Spaltennamen angeben.');
    return;
  }
  liste.spalten.push({id: uid(), name, typ});
  saveState();
  renderKlassenlisten();
}

function entferneSpalteAusListe(listId, spaltenId){
  if(!confirm('Diese Spalte inkl. aller eingetragenen Werte wirklich löschen?')) return;
  const liste = state.klassenlisten.find(l => l.id === listId);
  liste.spalten = liste.spalten.filter(sp => sp.id !== spaltenId);
  Object.values(liste.werte).forEach(w => delete w[spaltenId]);
  saveState();
  renderKlassenlisten();
}

function deleteKlassenliste(id){
  if(!confirm('Klassenliste wirklich löschen?')) return;
  state.klassenlisten = state.klassenlisten.filter(l => l.id !== id);
  aktiveKlassenlisteId = null;
  saveState();
  renderKlassenlisten();
}

function oeffneUndDruckeKlassenliste(id){
  aktiveKlassenlisteId = id;
  renderKlassenlisten();
  setTimeout(() => window.print(), 80);
}

/* ===================== Init ===================== */
ladeLogo();
renderLehrerZeile();
renderAll();
const eingebetteterTab = new URLSearchParams(window.location.search).get('tab');
if(['uebersicht','aufgaben','stoff','stoffuebersicht','klassen','abwesenheit','noten','kompetenz','kann','klassenlisten'].includes(eingebetteterTab)) showTab(eingebetteterTab);

</script>
