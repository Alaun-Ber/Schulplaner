<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Schulplaner</title>
<!-- Web-App-Unterstützung für "Zum Home-Bildschirm" (iPad/iPhone/Android) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schulplaner">
<meta name="theme-color" content="#123A63">
<link rel="apple-touch-icon" id="appleTouchIcon" href="">
<link rel="icon" id="faviconIcon" href="">
<link rel="manifest" id="webManifest" href="">
<style>
  :root{
    --bg: #EEF2F8;
    --paper: #FFFFFF;
    --ink: #16263D;
    --ink-soft: #52667E;
    --navy: #123A63;
    --navy-light: #1C5A94;
    --gold: #2E6FE0;
    --gold-light: #DDE9FC;
    --teal: #1C7FA6;
    --teal-light: #DDEFF6;
    --rose: #A34C4C;
    --rose-light: #F3E2E2;
    --line: #D8E0EC;
    --line-strong: #BCCADC;
    --radius: 6px;
    --font-head: Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-hand: 'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Sans MS', cursive;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  /* Header */
  header{
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.05) 0px,
        rgba(255,255,255,0.05) 27px,
        rgba(255,255,255,0.10) 28px
      ),
      linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    color:#EAF1FB;
    padding:22px 28px 0 28px;
  }
  header .title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  header h1{
    font-family:var(--font-head);
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:0.3px;
  }
  .schul-logo{
    height:52px;
    width:auto;
    display:block;
    object-fit:contain;
  }
  .logo-wrap{
    position:relative;
    flex-shrink:0;
    cursor:pointer;
    border-radius:6px;
  }
  .logo-wrap .schul-logo{
    background:#fff;
    border-radius:6px;
    padding:4px 8px;
  }
  .logo-wrap-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(18,58,99,0.82);
    color:#fff;
    font-size:11px;
    font-weight:600;
    border-radius:6px;
    opacity:0;
    transition:opacity 0.15s;
  }
  .logo-wrap:hover .logo-wrap-overlay{ opacity:1; }
  .print-only.schul-logo{ height:60px; }
  header .tagline{
    font-size:12px;
    color:#AFC7E4;
    margin-top:2px;
  }
  .schuljahr-badge{
    display:inline-block;
    margin-top:10px;
    padding:5px 14px;
    border-radius:20px;
    background:rgba(126,175,240,0.22);
    border:1px solid rgba(126,175,240,0.5);
    color:#DDE9FC;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.2px;
  }
  header .backup-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
    padding-bottom:14px;
  }
  header .backup-actions button{
    background:rgba(255,255,255,0.08);
    color:#EAF1FB;
    border:1px solid rgba(255,255,255,0.25);
    padding:6px 10px;
    border-radius:4px;
    font-size:12px;
    cursor:pointer;
  }
  header .backup-actions button:hover{ background:rgba(255,255,255,0.18); }

  .lehrer-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    padding:5px 14px;
    border-radius:20px;
    background:rgba(126,175,240,0.12);
    border:1px dashed rgba(126,175,240,0.45);
    color:#DDE9FC;
    font-size:12.5px;
    cursor:pointer;
  }
  .lehrer-badge:hover{ background:rgba(126,175,240,0.2); }
  .lehrer-badge input{
    background:transparent;
    border:none;
    border-bottom:1px solid rgba(255,255,255,0.6);
    color:#fff;
    font-size:12.5px;
    outline:none;
    width:170px;
  }
  .lehrer-badge .icon-btn{ color:#DDE9FC; font-size:13px; }

  nav.tabs{
    display:flex;
    gap:4px;
    padding:14px 24px 0 24px;
    flex-wrap:wrap;
  }
  nav.tabs button{
    font-family:var(--font-body);
    background:rgba(255,255,255,0.06);
    color:#BFD5EE;
    border:1px solid rgba(255,255,255,0.18);
    border-bottom:none;
    padding:10px 18px;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    transform:translateY(1px);
    transition:background 0.15s;
  }
  nav.tabs button:hover{ background:rgba(255,255,255,0.14); }
  nav.tabs button.active{
    background:var(--bg);
    color:var(--navy);
    border-color:var(--line);
  }

  main{
    max-width:1180px;
    margin:0 auto;
    padding:24px 28px 60px 28px;
  }
  .panel{
    display:none;
  }
  .panel.active{ display:block; }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 1px 2px rgba(30,42,56,0.04);
  }
  .card h2{
    font-family:var(--font-head);
    font-size:18px;
    margin:0 0 4px 0;
    color:var(--navy);
  }
  .card .hint{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 16px 0;
  }

  .field-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:flex-end;
    margin-bottom:12px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
    flex:1 1 160px;
    min-width:140px;
  }
  .field.grow{ flex:2 1 260px; }
  .field label{
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--ink-soft);
  }
  input, select, textarea{
    font-family:var(--font-body);
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--line-strong);
    border-radius:4px;
    background:#fff;
    color:var(--ink);
  }
  textarea{ resize:vertical; min-height:36px; }
  input:focus, select:focus, textarea:focus{
    outline:2px solid var(--teal);
    outline-offset:0;
    border-color:var(--teal);
  }

  .btn{
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:5px;
    border:1px solid transparent;
    cursor:pointer;
  }
  .btn-primary{ background:var(--navy); color:#fff; }
  .btn-primary:hover{ background:var(--navy-light); }
  .btn-gold{ background:var(--gold); color:#fff; }
  .btn-gold:hover{ background:#a17527; }
  .btn-outline{ background:#fff; color:var(--navy); border-color:var(--line-strong); }
  .btn-outline:hover{ background:#E7EDF5; }
  .btn-danger{ background:transparent; color:var(--rose); border-color:var(--rose-light); }
  .btn-danger:hover{ background:var(--rose-light); }
  .btn-sm{ padding:5px 10px; font-size:12px; }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.3px;
    color:var(--ink-soft);
    padding:8px 10px;
    border-bottom:2px solid var(--line-strong);
    white-space:nowrap;
  }
  td{
    padding:8px 10px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  tr:hover td{ background:#F7F9FC; }
  .badge{
    display:inline-block;
    padding:2px 8px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
  }
  .badge-teal{ background:var(--teal-light); color:var(--teal); }
  .badge-gold{ background:var(--gold-light); color:var(--gold); }
  .badge-rose{ background:var(--rose-light); color:var(--rose); }
  .badge-gray{ background:#E3E9F1; color:var(--ink-soft); }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:14px;
  }
  .toolbar .filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .empty-state{
    text-align:center;
    padding:36px 20px;
    color:var(--ink-soft);
    font-size:13px;
  }
  .empty-state .big{
    font-family:var(--font-head);
    font-size:16px;
    color:var(--navy);
    display:block;
    margin-bottom:4px;
  }
  .class-pill-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .class-pill{
    padding:7px 14px;
    border-radius:20px;
    border:1px solid var(--line-strong);
    background:#fff;
    cursor:pointer;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .class-pill.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
  }
  .grade-cell{
    text-align:center;
    font-weight:700;
    border-radius:4px;
    padding:2px 6px;
  }
  .g1{color:#2E7D52;} .g2{color:#4C8C3B;} .g3{color:#B8862E;}
  .g4{color:#C97B2E;} .g5{color:#B0512E;} .g6{color:#A34C4C;}

  .noten-liste{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    margin-top:5px;
  }
  .note-chip{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:20px;
    height:20px;
    border-radius:50%;
    font-size:10.5px;
    font-weight:700;
    color:#fff;
    cursor:default;
  }
  .note-chip.g1{background:#2E7D52;} .note-chip.g2{background:#4C8C3B;} .note-chip.g3{background:#B8862E;}
  .note-chip.g4{background:#C97B2E;} .note-chip.g5{background:#B0512E;} .note-chip.g6{background:#A34C4C;}

  .noten-tabelle{ border-collapse:collapse; }
  .noten-tabelle th, .noten-tabelle td{
    text-align:center;
    border:1px solid var(--line-strong);
    padding:6px 10px;
    font-size:12.5px;
    white-space:nowrap;
  }
  .noten-tabelle th{
    font-size:11.5px;
    text-transform:none;
    letter-spacing:normal;
    color:var(--ink);
  }
  .noten-tabelle .noten-name{ text-align:left; white-space:normal; }
  .noten-tabelle tbody tr:hover td{ background:#FBFAF6; }
  .noten-kat-lernkontrolle{ background:#BFE1F5; font-weight:700; }
  .noten-kat-lernkontrolle-light{ background:#E7F3FB; }
  .noten-kat-klassenarbeit{ background:#CBEAC7; font-weight:700; }
  .noten-kat-klassenarbeit-light{ background:#EBF7E9; }
  .noten-kat-mitarbeit{ background:#F3D9C0; font-weight:700; }
  .noten-kat-mitarbeit-light{ background:#FBEEE2; }
  .noten-endnote{ font-weight:700; color:var(--rose); font-size:14px; }

  .kr-cell{
    text-align:center;
    cursor:pointer;
    user-select:none;
    font-size:12px;
    font-weight:600;
    border-radius:4px;
    padding:6px 4px;
    min-width:64px;
  }
  .kr-0{ background:#E7EDF5; color:#7C8CA3; }
  .kr-1{ background:#F3E2E2; color:#A34C4C; }
  .kr-2{ background:var(--gold-light); color:var(--gold); }
  .kr-3{ background:var(--teal-light); color:var(--teal); }

  .kl-check{
    width:18px;height:18px;
    cursor:pointer;
  }

  .kl-arbeitsblatt-kopf{
    display:flex;
    gap:28px;
    flex-wrap:wrap;
    background:var(--gold-light);
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    padding:10px 16px;
    margin-bottom:14px;
    font-size:13.5px;
    color:var(--navy);
  }
  .kl-kategorie{
    background:var(--navy);
    color:#fff;
    font-weight:700;
    padding:8px 10px !important;
  }
  .kl-rate-btn{
    width:26px;
    height:26px;
    border-radius:5px;
    border:2px solid var(--line-strong);
    background:#fff;
    cursor:pointer;
  }
  .kl-rate-btn:hover{ border-color:var(--ink-soft); }
  .kl-rate-gut.aktiv{ background:#2E7D52; border-color:#2E7D52; }
  .kl-rate-mittel.aktiv{ background:var(--gold); border-color:var(--gold); }
  .kl-rate-schlecht.aktiv{ background:var(--rose); border-color:var(--rose); }

  .progress-bar{
    background:#E3E9F1;
    border-radius:20px;
    height:8px;
    width:100%;
    overflow:hidden;
  }
  .progress-bar-fill{
    background:var(--teal);
    height:100%;
  }

  .stoff-zusammenfassung{
    background:var(--gold-light);
    color:var(--navy);
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    padding:10px 14px;
    font-size:13px;
    margin-bottom:16px;
  }

  .tag-block{
    margin-bottom:22px;
  }
  .tag-block:last-child{ margin-bottom:0; }
  .tag-block-head{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:6px;
    padding-bottom:6px;
    border-bottom:2px solid var(--line-strong);
  }
  .tag-datum{
    font-family:var(--font-head);
    font-size:15px;
    font-weight:700;
    color:var(--navy);
  }
  .tag-wochentag{
    font-size:12px;
    color:var(--ink-soft);
    background:#E7EDF5;
    padding:2px 9px;
    border-radius:12px;
  }
  .tag-block-head button{ margin-left:auto; }
  tr.edit-row td{
    background:#EAF1FB;
    vertical-align:top;
    padding-top:10px;
    padding-bottom:10px;
  }
  tr.edit-row select{ margin-bottom:4px; width:100%; }

  .icon-btn{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:14px;
    padding:2px 6px;
  }
  .icon-btn:hover{ color:var(--rose); }

  select[multiple]{ min-height:80px; }

  .print-only{ display:none; }

  /* ===================== Standalone-/Web-App-Modus (iPad "Zum Home-Bildschirm") =====================
     Berücksichtigt abgerundete Ecken/Sensor-Ausschnitt, wenn die App ohne Safari-Rahmen läuft. */
  @media all and (display-mode: standalone){
    header{ padding-top:calc(22px + env(safe-area-inset-top)); }
    body.kiosk-active #panel-uebersicht{
      padding-top:calc(22px + env(safe-area-inset-top));
      padding-bottom:calc(22px + env(safe-area-inset-bottom));
      padding-left:calc(22px + env(safe-area-inset-left));
      padding-right:calc(22px + env(safe-area-inset-right));
    }
    .kiosk-exit-hint{ top:calc(16px + env(safe-area-inset-top)); }
  }

  /* ===================== Übersicht (Tagesdashboard, im Stil eines E-Ink-Tagesplaners) ===================== */
  .uebersicht-frame{
    background:linear-gradient(160deg, #6b7684 0%, #4d5866 100%);
    border-radius:26px;
    padding:16px;
    box-shadow:0 3px 12px rgba(20,28,38,0.18);
  }
  .uebersicht-grid{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:14px;
    align-items:stretch;
  }
  @media (max-width:760px){
    .uebersicht-grid{ grid-template-columns:1fr; }
  }
  .uebersicht-clock-card{
    background:#F4F0E7;
    color:#232323;
    border-radius:16px;
    padding:30px 20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    gap:2px;
  }
  .uebersicht-tag{
    font-family:var(--font-hand);
    font-size:30px;
    font-weight:400;
    line-height:1.2;
    margin:0;
  }
  .uebersicht-tageszeit{
    font-family:var(--font-hand);
    font-size:30px;
    font-weight:400;
    line-height:1.2;
    margin:0;
  }
  .uebersicht-zeit{
    font-family:var(--font-body);
    font-size:64px;
    font-weight:600;
    letter-spacing:0px;
    margin:4px 0 0 0;
    font-variant-numeric:tabular-nums;
    color:#1a1a1a;
  }
  .uebersicht-datum{
    font-family:var(--font-hand);
    font-size:22px;
    line-height:1.35;
    color:#232323;
  }
  .uebersicht-divider{
    width:70%;
    max-width:220px;
    border:none;
    border-top:1.5px solid #D9D0BE;
    margin:14px 0;
  }
  .uebersicht-todo-card{
    background:#F4F0E7;
    border-radius:16px;
    padding:6px 0;
    overflow:hidden;
  }
  .uebersicht-todo-head{
    padding:14px 18px 8px 18px;
  }
  .uebersicht-todo-head h2{
    font-family:var(--font-head);
    font-size:16px;
    margin:0 0 2px 0;
    color:var(--navy);
  }
  .uebersicht-todo-head .hint{ margin:0; }
  .uebersicht-section-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--ink-soft);
    padding:10px 18px 4px 18px;
    background:#F4F0E7;
  }
  .todo-list{
    display:flex;
    flex-direction:column;
  }
  .todo-row{
    display:flex;
    align-items:stretch;
    border-bottom:1px solid #E1D9C6;
    min-height:48px;
  }
  .todo-row:last-child{ border-bottom:none; }
  .todo-time{
    flex:0 0 92px;
    display:flex;
    align-items:center;
    padding:6px 10px 6px 18px;
    font-family:var(--font-hand);
    font-size:19px;
    color:#4a4a4a;
    border-right:1px solid #E1D9C6;
  }
  .todo-text{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:6px 14px;
    font-family:var(--font-hand);
    font-size:19px;
    color:#232323;
  }
  .todo-text .todo-sub{
    display:block;
    font-family:var(--font-body);
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .todo-row.done .todo-text{ color:#8a8a8a; }
  .todo-check-wrap{
    flex:0 0 62px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6px 8px;
  }
  .todo-check{
    width:100%;
    height:34px;
    border-radius:8px;
    border:none;
    background:#4e5760;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:700;
    color:#8b95a1;
  }
  .todo-row.done .todo-check{ color:#8BC34A; }
  .todo-add-row{
    display:flex;
    gap:8px;
    padding:14px 18px 16px 18px;
  }
  .todo-add-row input{ flex:1; }
  .todo-delete{
    flex:0 0 auto;
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:14px;
    padding:2px 4px;
    align-self:center;
    margin-right:4px;
  }
  .todo-delete:hover{ color:var(--rose); }
  .uebersicht-empty{
    padding:10px 18px 14px 18px;
    color:var(--ink-soft);
    font-size:13px;
    margin:0;
  }
  .uebersicht-empty a{ color:var(--teal); font-weight:600; text-decoration:none; }
  .uebersicht-empty a:hover{ text-decoration:underline; }
  .uebersicht-todo-head-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .uebersicht-todo-head-row a{ font-size:12.5px; color:var(--teal); font-weight:600; text-decoration:none; white-space:nowrap; }
  .uebersicht-todo-head-row a:hover{ text-decoration:underline; }

  /* ===================== Aufgabenplaner ===================== */
  .todo-list-plain{ display:flex; flex-direction:column; }
  .todo-plain-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 4px;
    border-bottom:1px solid var(--line);
  }
  .todo-plain-row:last-child{ border-bottom:none; }
  .todo-plain-row.editing{ padding:10px 4px; }
  .todo-check-inline{
    flex:0 0 auto;
    width:24px;

/* ---- Feiertagsberechnung (Berlin) ---- */
function ostersonntag(jahr){
  // Gaußsche Osterformel
  const k = Math.floor(jahr/100);
  const m = 15 + Math.floor((3*k+3)/4) - Math.floor((8*k+13)/25);
  const s = 2 - Math.floor((3*k+3)/4);
  const a = jahr % 19;
  const d = (19*a+m) % 30;
  const r = Math.floor((d+Math.floor(a/11))/29);
  const og = 21 + d - r;
  const sz = 7 - (jahr + Math.floor(jahr/4) + s) % 7;
  const oe = 7 - (((og - sz) % 7) + 7) % 7;
  const os = og + oe;
  let monat = 3, tag = os;
  if(tag > 31){ monat = 4; tag -= 31; }
  return new Date(jahr, monat-1, tag);
}

function addTage(date, n){
  const d = new Date(date);
  d.setDate(d.getDate()+n);
  return d;
}

function toISODate(date){
  return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
}

const _feiertageCache = {};
function feiertageBerlin(jahr){
  if(_feiertageCache[jahr]) return _feiertageCache[jahr];
  const ostern = ostersonntag(jahr);
  const dates = [
    `${jahr}-01-01`,
    `${jahr}-03-08`,
    toISODate(addTage(ostern,-2)),
    toISODate(addTage(ostern,1)),
    `${jahr}-05-01`,
    toISODate(addTage(ostern,39)),
    toISODate(addTage(ostern,50)),
    `${jahr}-10-03`,
    `${jahr}-12-25`,
    `${jahr}-12-26`
  ];
  _feiertageCache[jahr] = dates;
  return dates;
}

function istFeiertag(iso){
  const jahr = parseInt(iso.slice(0,4),10);
  return feiertageBerlin(jahr).includes(iso);
}

function istFerientag(iso){
  return state.ferien.some(f => iso >= f.von && iso <= f.bis);
}

function istSchulfrei(iso){
  return istFeiertag(iso) || istFerientag(iso);
}

/* ---- Schuljahr ---- */
function todayISO(){
  return toISODate(new Date());
}

function aktuellesSchuljahr(){
  const heute = todayISO();
  const sortiert = state.schuljahre.slice().sort((a,b) => a.von.localeCompare(b.von));
  let treffer = sortiert.find(sj => heute >= sj.von && heute <= sj.bis);
  if(treffer) return treffer;
  // kein laufendes Schuljahr hinterlegt: nächstes bevorstehendes zeigen
  treffer = sortiert.find(sj => sj.von > heute);
  if(treffer) return treffer;
  // sonst das zuletzt vergangene
  return sortiert.length ? sortiert[sortiert.length - 1] : null;
}

function aktuellesLogo(){
  try{
    return localStorage.getItem(LOGO_STORAGE_KEY) || STANDARD_LOGO;
  }catch(e){
    return STANDARD_LOGO;
  }
}

function ladeLogo(){
  const quelle = aktuellesLogo();
  const img1 = document.getElementById('schulLogoImg');
  const img2 = document.getElementById('schulLogoImgPrint');
  if(img1) img1.src = quelle;
  if(img2) img2.src = quelle;
  aktualisiereWebAppMeta(quelle);
}

// Setzt Home-Bildschirm-Icon (iOS: apple-touch-icon) und Web-App-Manifest dynamisch auf das
// aktuelle Schullogo, damit "Zum Home-Bildschirm hinzufügen" ein passendes Icon zeigt.
// Alles bleibt in dieser einen HTML-Datei enthalten (Manifest als data:-URI, kein separates File nötig).
function aktualisiereWebAppMeta(logoDataUrl){
  try{
    const appleIcon = document.getElementById('appleTouchIcon');
    const favicon = document.getElementById('faviconIcon');
    if(appleIcon) appleIcon.href = logoDataUrl;
    if(favicon) favicon.href = logoDataUrl;

    const manifest = {
      name: 'Schulplaner',
      short_name: 'Schulplaner',
      start_url: '.',
      display: 'standalone',
      background_color: '#EEF2F8',
      theme_color: '#123A63',
      icons: [
        {src: logoDataUrl, sizes: '192x192', type: 'image/png'},
        {src: logoDataUrl, sizes: '512x512', type: 'image/png'}
      ]
    };
    const manifestLink = document.getElementById('webManifest');
    if(manifestLink){
      manifestLink.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    }
  }catch(e){
    console.error('Web-App-Meta konnte nicht gesetzt werden', e);
  }
}

/* ===================== Lehrer:in (Nutzer:in der App) ===================== */
const LEHRER_STORAGE_KEY = 'schulplaner_lehrer';
let lehrerBearbeitenModus = false;

function ladeLehrerName(){
  try{
    return localStorage.getItem(LEHRER_STORAGE_KEY) || '';
  }catch(e){
    return '';
  }
}

function renderLehrerZeile(){
  const el = document.getElementById('lehrerZeile');
  if(!el) return;
  const name = ladeLehrerName();

  if(lehrerBearbeitenModus){
    el.innerHTML = `
      <span class="lehrer-badge">
        👤 <input type="text" id="lehrerNameInput" value="${esc(name)}" placeholder="Name eintragen" onkeydown="if(event.key==='Enter') speichereLehrerName();">
        <button class="icon-btn" onclick="speichereLehrerName()" title="Speichern">✓</button>
      </span>`;
    const input = document.getElementById('lehrerNameInput');
    if(input){ input.focus(); input.select(); }
  } else {
    el.innerHTML = `
      <span class="lehrer-badge" onclick="lehrerBearbeitenModus=true; renderLehrerZeile();" title="Klicken zum Bearbeiten">
        👤 ${name ? esc(name) : 'Lehrer:in eintragen'} <span style="opacity:0.7;">✎</span>
      </span>`;
  }
}

function speichereLehrerName(){
  const input = document.getElementById('lehrerNameInput');
  const wert = input ? input.value.trim() : '';
  try{
    localStorage.setItem(LEHRER_STORAGE_KEY, wert);
  }catch(e){
    alert('Name konnte nicht gespeichert werden: ' + e.message);
  }
  lehrerBearbeitenModus = false;
  renderLehrerZeile();
}

function logoHochladen(evt){
  const datei = evt.target.files[0];
  if(!datei) return;
  if(datei.size > 3 * 1024 * 1024){
    alert('Bitte ein Bild unter 3 MB verwenden.');
    evt.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    try{
      localStorage.setItem(LOGO_STORAGE_KEY, reader.result);
      ladeLogo();
    }catch(e){
      alert('Logo konnte nicht gespeichert werden: ' + e.message);
    }
  };
  reader.readAsDataURL(datei);
  evt.target.value = '';
}

/* ===================== Word-Export (.docx) ===================== */
/* Reiner Browser-ZIP/DOCX-Generator ohne externe Bibliotheken (funktioniert offline).
   Der Briefkopf (Logo | Titel | Datum/Name/Klasse) folgt exakt dem Layout der
   Vorlage "Kann_Liste_Muster.docx" (Annedore-Leber-Oberschule). */

const _crc32Table = (() => {
  const t = [];
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++){
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    }
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes){
  let crc = 0 ^ (-1);
  for(let i = 0; i < bytes.length; i++){
    crc = (crc >>> 8) ^ _crc32Table[(crc ^ bytes[i]) & 0xFF];
  }
  return (crc ^ (-1)) >>> 0;
}

function u16le(n){ return [n & 0xFF, (n >>> 8) & 0xFF]; }
function u32le(n){ return [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF]; }

function strToUtf8Bytes(str){
  return new TextEncoder().encode(str);
}

function base64ToBytes(base64){
  const binStr = atob(base64);
  const bytes = new Uint8Array(binStr.length);
  for(let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
  return bytes;
}

function concatBytes(arrays){
  let total = 0;
  arrays.forEach(a => total += a.length);
  const out = new Uint8Array(total);
  let offset = 0;
  arrays.forEach(a => { out.set(a, offset); offset += a.length; });
  return out;
}

// Minimaler ZIP-Writer (STORED, unkomprimiert) - ausreichend fuer gueltige .docx-Dateien
function buildZip(files){
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  files.forEach(f => {
    const nameBytes = strToUtf8Bytes(f.name);
    const data = f.data;
    const crc = crc32(data);
    const size = data.length;

    const localHeader = new Uint8Array([
      ...u32le(0x04034b50),
      ...u16le(20), ...u16le(0), ...u16le(0),
      ...u16le(0), ...u16le(0),
      ...u32le(crc),
      ...u32le(size), ...u32le(size),
      ...u16le(nameBytes.length), ...u16le(0),
      ...nameBytes
    ]);
    localParts.push(localHeader, data);

    const centralHeader = new Uint8Array([
      ...u32le(0x02014b50),
      ...u16le(20), ...u16le(20),
      ...u16le(0), ...u16le(0),
      ...u16le(0), ...u16le(0),
      ...u32le(crc),
      ...u32le(size), ...u32le(size),
      ...u16le(nameBytes.length), ...u16le(0), ...u16le(0),
      ...u16le(0), ...u16le(0),
      ...u32le(0),
      ...u32le(offset),
      ...nameBytes
    ]);
    centralParts.push(centralHeader);

    offset += localHeader.length + data.length;
  });

  const centralDir = concatBytes(centralParts);
  const localData = concatBytes(localParts);
  const eocd = new Uint8Array([
    ...u32le(0x06054b50),
    ...u16le(0), ...u16le(0),
    ...u16le(files.length), ...u16le(files.length),
    ...u32le(centralDir.length),
    ...u32le(localData.length),
    ...u16le(0)
  ]);

  return concatBytes([localData, centralDir, eocd]);
}

function xmlEsc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function baueUndLadeDocx(dateiname, kannListeName, bodyXml){
  const logoBytes = base64ToBytes(WORD_TEMPLATE_LOGO_JPEG_BASE64);
  const files = [
    { name: '[Content_Types].xml', data: strToUtf8Bytes(DOCX_CONTENT_TYPES) },
    { name: '_rels/.rels', data: strToUtf8Bytes(DOCX_RELS_ROOT) },
    { name: 'word/document.xml', data: strToUtf8Bytes(buildDocxDocumentXml(bodyXml)) },
    { name: 'word/_rels/document.xml.rels', data: strToUtf8Bytes(DOCX_DOCUMENT_RELS) },
    { name: 'word/styles.xml', data: strToUtf8Bytes(DOCX_STYLES) },
    { name: 'word/header1.xml', data: strToUtf8Bytes(buildDocxHeaderXml(kannListeName)) },
    { name: 'word/_rels/header1.xml.rels', data: strToUtf8Bytes(DOCX_HEADER_RELS) },
    { name: 'word/media/image1.jpeg', data: logoBytes }
  ];
  const zipBytes = buildZip(files);
  const blob = new Blob([zipBytes], {type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = dateiname;
  a.click();
  URL.revokeObjectURL(url);
}

// --- Tabellen-Bausteine fuer den Dokumentkoerper ---
function docxTcXml(text, opts){
  opts = opts || {};
  const w = opts.w;
  const align = opts.align || 'left';
  const bold = !!opts.bold;
  const shade = opts.shade;
  const color = opts.color;
  const gridSpan = opts.gridSpan;
  const tcPrParts = [`<w:tcW w:w="${w}" w:type="dxa"/>`];
  if(gridSpan) tcPrParts.push(`<w:gridSpan w:val="${gridSpan}"/>`);
  if(shade) tcPrParts.push(`<w:shd w:val="clear" w:fill="${shade}"/>`);
  tcPrParts.push('<w:vAlign w:val="center"/>');
  const rPr = (bold ? '<w:b/>' : '') + (color ? `<w:color w:val="${color}"/>` : '');
  return `<w:tc><w:tcPr>${tcPrParts.join('')}</w:tcPr><w:p><w:pPr><w:jc w:val="${align}"/></w:pPr><w:r>${rPr ? `<w:rPr>${rPr}</w:rPr>` : ''}<w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p></w:tc>`;
}

function docxTableStart(colWidths){
  const grid = colWidths.map(w => `<w:gridCol w:w="${w}"/>`).join('');
  const total = colWidths.reduce((a,b) => a+b, 0);
  return `<w:tbl><w:tblPr><w:tblW w:w="${total}" w:type="dxa"/><w:tblBorders><w:top w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:left w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:right w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:insideH w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:insideV w:val="single" w:sz="4" w:space="0" w:color="auto"/></w:tblBorders></w:tblPr><w:tblGrid>${grid}</w:tblGrid>`;
}

function exportKannArbeitsblattWord(listId, schuelerId){
  const liste = state.kannlisten.find(l => l.id === listId);
  const schueler = state.schueler.find(s => s.id === schuelerId);
  if(!liste || !schueler) return;

  const spalten = [600, 4900, 900, 850, 850, 1256];
  let body = docxTableStart(spalten);
  body += '<w:tr>' +
    docxTcXml('Nr.', {w:spalten[0], align:'center', bold:true, color:'FFFFFF', shade:'123A63'}) +
    docxTcXml('Ich kann...', {w:spalten[1], bold:true, color:'FFFFFF', shade:'123A63'}) +
    docxTcXml('Niveau', {w:spalten[2], align:'center', bold:true, color:'FFFFFF', shade:'123A63'}) +
    docxTcXml('gut', {w:spalten[3], align:'center', bold:true, color:'FFFFFF', shade:'123A63'}) +
    docxTcXml('mittel', {w:spalten[4], align:'center', bold:true, color:'FFFFFF', shade:'123A63'}) +
    docxTcXml('schlecht', {w:spalten[5], align:'center', bold:true, color:'FFFFFF', shade:'123A63'}) +
    '</w:tr>';

  const werteSchueler = liste.werte[schuelerId] || {};
  let laufendeNr = 0;
  const gesamtBreite = spalten.reduce((a,b)=>a+b,0);

  liste.items.forEach(item => {
    if(item.typ === 'header'){
      body += '<w:tr>' + docxTcXml(item.text, {w:gesamtBreite, bold:true, shade:'DDE9FC', gridSpan:6}) + '</w:tr>';
      return;
    }
    laufendeNr++;
    const wert = werteSchueler[item.id] || null;
    const kennz = (stufe) => wert === stufe ? 'X' : '';
    const farbe = (stufe) => wert === stufe ? (stufe==='gut' ? 'C6E8D4' : stufe==='mittel' ? 'FBEBCB' : 'F5D6D6') : undefined;
    body += '<w:tr>' +
      docxTcXml(String(laufendeNr) + '.', {w:spalten[0], align:'center'}) +
      docxTcXml(item.text, {w:spalten[1]}) +
      docxTcXml(item.niveau || '', {w:spalten[2], align:'center'}) +
      docxTcXml(kennz('gut'), {w:spalten[3], align:'center', shade:farbe('gut')}) +
      docxTcXml(kennz('mittel'), {w:spalten[4], align:'center', shade:farbe('mittel')}) +
      docxTcXml(kennz('schlecht'), {w:spalten[5], align:'center', shade:farbe('schlecht')}) +
      '</w:tr>';
  });
  body += '</w:tbl>';

  const dateiname = `${liste.name} - ${schueler.nachname} ${schueler.vorname}.docx`.replace(/[\\/:*?"<>|]/g, '_');
  baueUndLadeDocx(dateiname, liste.name, body);
}

function exportKannMatrixWord(listId){
  const liste = state.kannlisten.find(l => l.id === listId);
  if(!liste) return;
  const schueler = schuelerOfKlasse(liste.klasseId);

  const nameBreite = 2400;
  const restBreite = 6956;
  const proSpalte = Math.max(500, Math.floor(restBreite / Math.max(1, liste.items.length)));
  const spalten = [nameBreite, ...liste.items.map(() => proSpalte)];

  let body = docxTableStart(spalten);
  body += '<w:tr>' + docxTcXml('Schüler:in', {w:spalten[0], bold:true, color:'FFFFFF', shade:'123A63'}) +
    liste.items.map((it,i) => docxTcXml(it, {w:spalten[i+1], align:'center', bold:true, color:'FFFFFF', shade:'123A63'})).join('') +
    '</w:tr>';

  schueler.forEach(s => {
    const werte = liste.werte[s.id] || [];
    body += '<w:tr>' + docxTcXml(`${s.nachname}, ${s.vorname}`, {w:spalten[0]}) +
      liste.items.map((it,i) => docxTcXml(werte[i] ? 'X' : '', {w:spalten[i+1], align:'center', shade: werte[i] ? 'C6E8D4' : undefined})).join('') +
      '</w:tr>';
  });
  body += '</w:tbl>';

  const dateiname = `${liste.name}.docx`.replace(/[\\/:*?"<>|]/g, '_');
  baueUndLadeDocx(dateiname, liste.name, body);
}

function colLetter(n){
  let s = '';
  n = n + 1;
  while(n > 0){
    const rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

        return `<c r="${ref}"${styleAttr}><v>${cell.value}</v></c>`;
      }
      const text = cell.text || '';
      if(text === '') return `<c r="${ref}"${styleAttr}/>`;
      return `<c r="${ref}"${styleAttr} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(text)}</t></is></c>`;
    }).join('');
    return `<row r="${rIdx + 1}">${cellsXml}</row>`;
  }).join('');

  const dimension = `A1:${colLetter(totalCols - 1)}${zeilen.length}`;
  const mergeXml = merges.length ? `<mergeCells count="${merges.length}">${merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>` : '';
  const colsXml = `<cols><col min="1" max="1" width="24" customWidth="1"/><col min="2" max="${totalCols}" width="12" customWidth="1"/></cols>`;

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<dimension ref="${dimension}"/>
<sheetViews><sheetView workbookViewId="0"/></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
${colsXml}
<sheetData>${rowsXml}</sheetData>
${mergeXml}
</worksheet>`;
}

function baueUndLadeXlsx(dateiname, sheetXml){
  const files = [
    { name: '[Content_Types].xml', data: strToUtf8Bytes(XLSX_CONTENT_TYPES) },
    { name: '_rels/.rels', data: strToUtf8Bytes(XLSX_RELS_ROOT) },
    { name: 'xl/workbook.xml', data: strToUtf8Bytes(XLSX_WORKBOOK) },
    { name: 'xl/_rels/workbook.xml.rels', data: strToUtf8Bytes(XLSX_WORKBOOK_RELS) },
    { name: 'xl/styles.xml', data: strToUtf8Bytes(XLSX_STYLES_XML) },
    { name: 'xl/worksheets/sheet1.xml', data: strToUtf8Bytes(sheetXml) }
  ];
  const zipBytes = buildZip(files);
  const blob = new Blob([zipBytes], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = dateiname;
  a.click();
  URL.revokeObjectURL(url);
}

function exportNotenExcel(){
  const liste = schuelerOfKlasse(notenKlasseId);
  if(liste.length === 0){
    alert('Keine Schüler:innen in dieser Klasse.');
    return;
  }
  const XS = NOTEN_XLSX_STYLE;
  const kategorien = NOTEN_KATEGORIEN.map(kat => ({kat, spalten: notenSpaltenFuerKategorie(notenKlasseId, kat.key)}));
  const gewichtung = gewichtungFuerKlasse(notenKlasseId);

  let col = 1; // Spalte 0 = Name
  const catRanges = [];
  kategorien.forEach(({kat, spalten}) => {
    const colStart = col;
    col += spalten.length;
    const oCol = col;
    col += 1;
    catRanges.push({kat, spalten, colStart, oCol, colEnd: col - 1});
  });
  const endnoteCol = col;
  const totalCols = col + 1;
  const merges = [];

  const zeile1 = new Array(totalCols).fill(null);
  zeile1[0] = {text: 'Name, Vorname', style: XS.nameHeader};
  merges.push(xlsxMergeRef(0, 0, 0, 2));
  catRanges.forEach(cr => {
    const stil = XS.cat[cr.kat.key];
    zeile1[cr.colStart] = {text: `${cr.kat.label} (${formatProzent(gewichtung[cr.kat.key] || 0)} %)`, style: stil.header};
    for(let c = cr.colStart; c <= cr.oCol; c++){ if(c !== cr.colStart) zeile1[c] = {text: '', style: stil.header}; }
    merges.push(xlsxMergeRef(cr.colStart, 0, cr.oCol, 0));
  });
  zeile1[endnoteCol] = {text: 'Endnote', style: XS.nameHeader};
  merges.push(xlsxMergeRef(endnoteCol, 0, endnoteCol, 2));

  const zeile2 = new Array(totalCols).fill(null);
  zeile2[0] = {text: '', style: XS.nameHeader};
  zeile2[endnoteCol] = {text: '', style: XS.nameHeader};
  catRanges.forEach(cr => {
    const stil = XS.cat[cr.kat.key];
    cr.spalten.forEach((sp, i) => { zeile2[cr.colStart + i] = {text: sp.datum ? formatDatum(sp.datum) : '—', style: stil.sub}; });
    zeile2[cr.oCol] = {text: 'Ø', style: stil.sub};
    merges.push(xlsxMergeRef(cr.oCol, 1, cr.oCol, 2));
  });

  const zeile3 = new Array(totalCols).fill(null);
  zeile3[0] = {text: '', style: XS.nameHeader};
  zeile3[endnoteCol] = {text: '', style: XS.nameHeader};
  catRanges.forEach(cr => {
    const stil = XS.cat[cr.kat.key];
    cr.spalten.forEach((sp, i) => { zeile3[cr.colStart + i] = {text: sp.bezeichnung, style: stil.sub}; });
  });

  const datenZeilen = liste.map(s => {
    const zeile = new Array(totalCols).fill(null);
    zeile[0] = {text: `${s.nachname}, ${s.vorname}`, style: XS.nameData};
    catRanges.forEach(cr => {
      const stil = XS.cat[cr.kat.key];
      cr.spalten.forEach((sp, i) => {
        const n = findeNote(s.id, cr.kat.key, sp);
        zeile[cr.colStart + i] = n ? {value: n.wert, style: stil.data} : {text: '', style: stil.data};
      });
      const schnitt = schnittFuer(s.id, cr.kat.key);
      zeile[cr.oCol] = schnitt !== null ? {value: Math.round(schnitt * 10) / 10, style: stil.sub} : {text: '—', style: stil.sub};
    });
    const end = endnoteFuer(s.id);
    zeile[endnoteCol] = end !== null ? {value: Math.round(end * 100) / 100, style: XS.endnoteData} : {text: '—', style: XS.endnoteData};
    return zeile;
  });

  const alleZeilen = [zeile1, zeile2, zeile3, ...datenZeilen];
  const sheetXml = buildXlsxSheetXml(alleZeilen, merges, totalCols);
  const dateiname = `Notenübersicht - ${klasseName(notenKlasseId)}.xlsx`.replace(/[\\/:*?"<>|]/g, '_');
  baueUndLadeXlsx(dateiname, sheetXml);
}

function loadState(){

    if(!raw) return defaultState();

  }catch(e){

  }
}

function saveState(){
  try{
    state.aktualisiertAm = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

  }
}

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

// Wandelt ältere Stoffverteilungs-Einträge (ein Eintrag = Block über mehrere Stunden mit
// gemeinsamem Fach) in das aktuelle Modell um: jede Unterrichtsstunde ist ein eigener,
// unabhängig bearbeitbarer Eintrag mit eigenem Fach/Klasse/Material.
function migriereStoffEintraege(){
  let veraendert = false;
  const neu = [];
  state.stoff.forEach(e => {
    if(typeof e.stunde === 'number'){
      neu.push(e); // bereits neues Format
      return;
    }
    veraendert = true;
    const von = e.stundeVon || 1;
    const bis = (e.stundeBis && e.stundeBis > von) ? e.stundeBis : von;
    const materialMap = e.materialien || (e.material !== undefined ? {[von]: e.material} : {});
    for(let s = von; s <= bis; s++){
      neu.push({
        id: (s === von) ? e.id : uid(),
        datum: e.datum,
        stunde: s,
        fach: e.fach,
        klasseId: e.klasseId,
        material: materialMap[s] || '',
        serienId: e.serienId
      });
    }
  });
  if(veraendert){
    state.stoff = neu;
    saveState();
  }
}
migriereStoffEintraege();

// Wandelt das ältere "uebersichtToDos"-Format (Aufgaben nur für den jeweiligen Tag, ohne
// Uhrzeit, gruppiert nach Datum) in die neue, freie Aufgabenliste (state.aufgaben) um.
function migriereUebersichtToDos(){
  const keys = Object.keys(state.uebersichtToDos || {});
  if(keys.length === 0) return;
  keys.forEach(datum => {
    (state.uebersichtToDos[datum] || []).forEach(item => {
      state.aufgaben.push({id: item.id || uid(), datum, zeit:'', text: item.text, erledigt: !!item.erledigt});
    });
  });
  state.uebersichtToDos = {};
  saveState();
}
migriereUebersichtToDos();

/* ===================== Cloud-Synchronisierung (z. B. iCloud Drive) =====================
   Nutzt die File System Access API, um die Sicherungsdatei direkt mit einer Datei auf der
   Festplatte zu verknüpfen (z. B. im lokalen iCloud-Drive-Ordner). Sobald diese Datei durch
   iCloud/OneDrive/Dropbox mit anderen Geräten synchronisiert wird, lässt sich dort dieselbe
   Datei verbinden. Wird derzeit nur von Chrome, Edge und Opera unterstützt (nicht von Safari
   oder Firefox) — dort wird stattdessen der manuelle Export/Import-Weg empfohlen.
   (Die zugehörigen Variablen sind bereits ganz oben im Skript deklariert, siehe State & Storage.) */

function cloudDb(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(CLOUD_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(CLOUD_DB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function cloudDbSet(handle){
  const db = await cloudDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CLOUD_DB_STORE, 'readwrite');
    tx.objectStore(CLOUD_DB_STORE).put(handle, 'syncHandle');
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function cloudDbGet(){
  const db = await cloudDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CLOUD_DB_STORE, 'readonly');
    const req = tx.objectStore(CLOUD_DB_STORE).get('syncHandle');
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function cloudDbDelete(){
  const db = await cloudDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CLOUD_DB_STORE, 'readwrite');
    tx.objectStore(CLOUD_DB_STORE).delete('syncHandle');
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function cloudSyncInit(){
  if(!CLOUD_SYNC_SUPPORTED) return;
  try{
    const handle = await cloudDbGet();
    if(!handle) return;
    cloudSyncHandle = handle;
    cloudSyncName = handle.name;
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){
      cloudSyncStatus = 'verbunden';
      await cloudSyncPull(true);
    }else{
      cloudSyncStatus = 'berechtigung-noetig';
    }
  }catch(e){
    console.error('Cloud-Sync: Wiederverbinden fehlgeschlagen', e);
  }
  renderStoff();
}

async function cloudSyncNeuVerbinden(){
  if(!cloudSyncHandle) return;
  try{
    const perm = await cloudSyncHandle.requestPermission({mode:'readwrite'});
    if(perm === 'granted'){
      cloudSyncStatus = 'verbunden';
      await cloudSyncPull(true);
    }
  }catch(e){
    alert('Verbindung fehlgeschlagen: ' + e.message);
  }
  renderStoff();
}

async function cloudSyncVerbindenVorhanden(){
  if(!CLOUD_SYNC_SUPPORTED){
    alert('Dein Browser unterstützt keine direkte Dateiverknüpfung. Nutze stattdessen „Daten sichern“ und „Daten laden“.');
    return;
  }
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{description:'Schulplaner-Synchronisierungsdatei', accept:{'application/json':['.json']}}]
    });
    await handle.requestPermission({mode:'readwrite'});
    cloudSyncHandle = handle;
    cloudSyncName = handle.name;
    cloudSyncStatus = 'verbunden';
    await cloudDbSet(handle);
    await cloudSyncPull(true);
    await cloudSyncPush();
  }catch(e){
    if(e.name !== 'AbortError') alert('Verbindung fehlgeschlagen: ' + e.message);
  }
  renderStoff();
}

async function cloudSyncNeueDatei(){
  if(!CLOUD_SYNC_SUPPORTED){
    alert('Dein Browser unterstützt keine direkte Dateiverknüpfung. Nutze stattdessen „Daten sichern“ und „Daten laden“.');
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'schulplaner-sync.json',
      types: [{description:'Schulplaner-Synchronisierungsdatei', accept:{'application/json':['.json']}}]
    });
    cloudSyncHandle = handle;
    cloudSyncName = handle.name;
    cloudSyncStatus = 'verbunden';
    await cloudDbSet(handle);
    await cloudSyncPush();
  }catch(e){
    if(e.name !== 'AbortError') alert('Datei konnte nicht angelegt werden: ' + e.message);
  }
  renderStoff();
}

async function cloudSyncTrennen(){
  if(!confirm('Verbindung zur Synchronisierungsdatei wirklich trennen? Deine Daten bleiben lokal erhalten.')) return;
  cloudSyncHandle = null;
  cloudSyncName = '';
  cloudSyncStatus = 'getrennt';
  await cloudDbDelete();
  renderStoff();
}

async function cloudSyncPush(){
  if(!cloudSyncHandle || cloudSyncStatus !== 'verbunden') return;
  try{
    const perm = await cloudSyncHandle.queryPermission({mode:'readwrite'});
    if(perm !== 'granted') return;
    const writable = await cloudSyncHandle.createWritable();
    await writable.write(JSON.stringify(state, null, 2));
    await writable.close();
    cloudSyncLast = new Date().toISOString();
    localStorage.setItem(CLOUD_LAST_KEY, cloudSyncLast);
  }catch(e){
    console.error('Cloud-Sync: Schreiben fehlgeschlagen', e);
  }
}

async function cloudSyncPull(leise){
  if(!cloudSyncHandle) return;
  try{
    const perm = await cloudSyncHandle.queryPermission({mode:'readwrite'});
    if(perm !== 'granted') return;
    const file = await cloudSyncHandle.getFile();
    const text = await file.text();
    if(!text || !text.trim()) return;
    const parsed = JSON.parse(text);
    const remoteZeit = parsed.aktualisiertAm || '';
    const lokalZeit = state.aktualisiertAm || '';
    if(remoteZeit && remoteZeit > lokalZeit){
      state = Object.assign(defaultState(), parsed);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderAll();
      if(!leise) alert('Neuere Daten aus der Synchronisierungsdatei wurden geladen.');
    }else if(!leise){
      alert('Deine Daten sind bereits aktuell.');
    }
  }catch(e){
    console.error('Cloud-Sync: Lesen fehlgeschlagen', e);
  }
}

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && cloudSyncHandle && cloudSyncStatus === 'verbunden'){
    cloudSyncPull(true);
  }
});

/* ===================== UI helpers ===================== */
function esc(str){
  if(str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function klasseName(id){
  const k = state.klassen.find(k => k.id === id);
  return k ? k.name : '—';
}

function schuelerName(id){
  const s = state.schueler.find(s => s.id === id);
  return s ? `${s.nachname}, ${s.vorname}` : '—';
}

function schuelerOfKlasse(klasseId){
  return state.schueler
    .filter(s => s.klasseId === klasseId)
    .sort((a,b) => a.nachname.localeCompare(b.nachname, 'de'));
}

function klasseOptions(selectedId){
  if(state.klassen.length === 0) return '<option value="">Keine Klasse angelegt</option>';
  return state.klassen
    .slice()
    .sort((a,b) => a.name.localeCompare(b.name,'de'))
    .map(k => `<option value="${k.id}" ${k.id===selectedId?'selected':''}>${esc(k.name)}</option>`)
    .join('');
}

function showTab(name){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('main .panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  renderAll();
}

/* ===================== Export / Import ===================== */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const datum = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `schulplaner-sicherung-${datum}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!confirm('Aktuelle Daten werden durch die Sicherung ersetzt. Fortfahren?')) return;
      state = Object.assign(defaultState(), parsed);
      saveState();
      renderAll();
      alert('Daten erfolgreich geladen.');
    }catch(e){
      alert('Diese Datei konnte nicht gelesen werden: ' + e.message);
    }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

/* ===================== ÜBERSICHT (Tagesdashboard) ===================== */
const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function heuteISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function tageszeitVon(stunde){
  if(stunde < 5) return 'Nacht';
  if(stunde < 10) return 'Morgen';
  if(stunde < 12) return 'Vormittag';
  if(stunde < 14) return 'Mittag';
  if(stunde < 18) return 'Nachmittag';
  if(stunde < 22) return 'Abend';
  return 'Nacht';
}

// Berechnet die ISO-8601-Kalenderwoche (Woche beginnt Montag, KW 1 enthält den ersten
// Donnerstag des Jahres) für ein Datum.
function kalenderwoche(datum){
  const d = new Date(Date.UTC(datum.getFullYear(), datum.getMonth(), datum.getDate()));
  const wochentag = d.getUTCDay() || 7; // Sonntag (0) -> 7
  d.setUTCDate(d.getUTCDate() + 4 - wochentag);
  const jahresbeginn = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - jahresbeginn) / 86400000) + 1) / 7);
}

function updateUebersichtUhrzeit(){
  const zeitEl = document.getElementById('uebersichtZeit');
  if(!zeitEl) return; // Tab evtl. gerade nicht im DOM gerendert
  const jetzt = new Date();
  zeitEl.textContent = `${String(jetzt.getHours()).padStart(2,'0')}:${String(jetzt.getMinutes()).padStart(2,'0')}`;
  const tageszeitEl = document.getElementById('uebersichtTageszeit');
  if(tageszeitEl) tageszeitEl.textContent = tageszeitVon(jetzt.getHours());
}

/* ===================== Kiosk-/Vollbildmodus ===================== */
let kioskActive = false;

function kioskEin(){
  kioskActive = true;
  document.body.classList.add('kiosk-active');
  if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(() => {});
  }
  renderUebersicht();
}

function kioskAus(){
  if(!kioskActive) return;
  kioskActive = false;
  document.body.classList.remove('kiosk-active');
  if(document.fullscreenElement && document.exitFullscreen){
    document.exitFullscreen().catch(() => {});
  }
  renderUebersicht();
}

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && kioskActive){
    kioskAus();
  }
});

document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement && kioskActive){
    kioskAus();
  }
});

  const stundenHeute = state.stoff
    .filter(e => e.datum === datum)
    .slice()
    .sort((a,b) => (a.stunde||0) - (b.stunde||0));

    ? `<p class="uebersicht-empty">Heute sind keine Unterrichtsstunden eingetragen.</p>`

/* ===================== AUFGABENPLANER ===================== */
let aufgabenEditingId = null;
let aufgabenZeigeVergangene = false;
let aufgabenNurOffene = false;

function addAufgabeSchnell(){
  const input = document.getElementById('uebersichtNeuesTodo');
  const text = input.value.trim();
  if(!text) return;
  state.aufgaben.push({id: uid(), datum: heuteISO(), zeit:'', text, erledigt:false});
  saveState();
  renderUebersicht();
  renderAufgaben();
}

function addAufgabe(){
  const datum = document.getElementById('neueAufgabeDatum').value;
  const zeit = document.getElementById('neueAufgabeZeit').value;
  const text = document.getElementById('neueAufgabeText').value.trim();
  if(!datum){ alert('Bitte ein Datum wählen.'); return; }
  if(!text){ alert('Bitte einen Aufgabentext eingeben.'); return; }
  state.aufgaben.push({id: uid(), datum, zeit: zeit || '', text, erledigt:false});
  saveState();
  document.getElementById('neueAufgabeText').value = '';
  renderAufgaben();
  renderUebersicht();
}

function toggleAufgabeErledigt(id){
  const a = state.aufgaben.find(a => a.id === id);
  if(!a) return;
  a.erledigt = !a.erledigt;
  saveState();
  renderAufgaben();
  renderUebersicht();
}

function deleteAufgabe(id){
  if(!confirm('Aufgabe wirklich löschen?')) return;
  state.aufgaben = state.aufgaben.filter(a => a.id !== id);
  saveState();
  renderAufgaben();
  renderUebersicht();
}

function startEditAufgabe(id){
  aufgabenEditingId = id;
  renderAufgaben();
}

function cancelEditAufgabe(){
  aufgabenEditingId = null;
  renderAufgaben();
}

function saveEditAufgabe(id){
  const a = state.aufgaben.find(a => a.id === id);
  if(!a) return;
  const datum = document.getElementById('editAufgabeDatum_' + id).value;
  const zeit = document.getElementById('editAufgabeZeit_' + id).value;
  const text = document.getElementById('editAufgabeText_' + id).value.trim();
  if(!datum || !text){ alert('Datum und Aufgabentext dürfen nicht leer sein.'); return; }
  a.datum = datum;
  a.zeit = zeit || '';
  a.text = text;
  aufgabenEditingId = null;
  saveState();
  renderAufgaben();
  renderUebersicht();
}

function toggleAufgabenVergangene(){
  aufgabenZeigeVergangene = document.getElementById('aufgabenVergangeneCheckbox').checked;
  renderAufgaben();
}

function toggleAufgabenNurOffene(){
  aufgabenNurOffene = document.getElementById('aufgabenNurOffeneCheckbox').checked;
  renderAufgaben();
}

function renderAufgabeRow(a){
  return `
    <div class="todo-plain-row ${a.erledigt ? 'done' : ''}">
      <button class="todo-check-inline" onclick="toggleAufgabeErledigt('${a.id}')" title="Erledigt markieren">${a.erledigt ? '✓' : ''}</button>

    </div>`;
}

function renderAufgabeEditRow(a){
  return `
    <div class="todo-plain-row editing">

        <div class="field" style="max-width:150px;">

function renderAufgaben(){
  const el = document.getElementById('panel-aufgaben');
  if(!el) return;
  const heute = heuteISO();

  let liste = state.aufgaben.slice();
  if(!aufgabenZeigeVergangene) liste = liste.filter(a => a.datum >= heute);
  if(aufgabenNurOffene) liste = liste.filter(a => !a.erledigt);
  liste.sort((a,b) => {
    if(a.datum !== b.datum) return a.datum.localeCompare(b.datum);
    return (a.zeit || '99:99').localeCompare(b.zeit || '99:99');
  });

  const gruppen = {};
  liste.forEach(a => { (gruppen[a.datum] = gruppen[a.datum] || []).push(a); });
  const tage = Object.keys(gruppen).sort();

  const listHtml = tage.length === 0
    ? `<p class="empty-state">Keine Aufgaben gefunden.</p>`
    : tage.map(datum => `
        <div class="card" style="margin-bottom:14px;">
          <h2 style="font-size:15px;">${wochentagName(datum)}, ${formatDatum(datum)} ${datum === heute ? '<span class="badge badge-teal">heute</span>' : ''}</h2>
          <div class="todo-list-plain">
            ${gruppen[datum].map(a => aufgabenEditingId === a.id ? renderAufgabeEditRow(a) : renderAufgabeRow(a)).join('')}
          </div>
        </div>`).join('');

  el.innerHTML = `
    <div class="card no-print">
      <h2>Neue Aufgabe planen</h2>
      <p class="hint">Lege eine Aufgabe mit Datum und optional Uhrzeit an. Aufgaben für heute erscheinen automatisch in der Übersicht.</p>
      <div class="field-row">
        <div class="field">
          <label>Datum</label>
          <input type="date" id="neueAufgabeDatum" value="${heute}">
        </div>
        <div class="field" style="max-width:140px;">
          <label>Uhrzeit (optional)</label>
          <input type="time" id="neueAufgabeZeit">
        </div>
        <div class="field grow">
          <label>Aufgabe</label>
          <input type="text" id="neueAufgabeText" placeholder="z. B. Elternbriefe kopieren" onkeydown="if(event.key==='Enter') addAufgabe()">
        </div>
        <button class="btn btn-primary" onclick="addAufgabe()">+ Aufgabe hinzufügen</button>
      </div>
    </div>

    <div class="toolbar no-print">
      <div class="filters">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
          <input type="checkbox" id="aufgabenVergangeneCheckbox" onchange="toggleAufgabenVergangene()" ${aufgabenZeigeVergangene ? 'checked' : ''}>
          Auch vergangene Aufgaben anzeigen
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
          <input type="checkbox" id="aufgabenNurOffeneCheckbox" onchange="toggleAufgabenNurOffene()" ${aufgabenNurOffene ? 'checked' : ''}>
          Nur offene Aufgaben
        </label>
      </div>
    </div>

    ${listHtml}
  `;
}

            ${state.klassen.map(k => `<option value="${k.id}" ${stoffFilterKlasse===k.id?'selected':''}>${esc(k.name)}</option>`).join('')}
          </select>
          <input type="date" value="${stoffFilterVon}" title="Zeitraum von" onchange="stoffFilterVon=this.value; renderStoffUebersicht();">
          <span class="hint" style="align-self:center;">bis</span>
          <input type="date" value="${stoffFilterBis}" title="Zeitraum bis" onchange="stoffFilterBis=this.value; renderStoffUebersicht();">
          ${(stoffFilterVon || stoffFilterBis) ? `<button class="btn btn-outline btn-sm no-print" onclick="stoffFilterVon=''; stoffFilterBis=''; renderStoffUebersicht();">Zeitraum zurücksetzen</button>` : ''}
          <button class="btn btn-gold no-print" onclick="window.print()">⎙ Drucken</button>
        </div>
      </div>
      ${renderStoffZusammenfassung()}
      ${renderStoffTable()}
    </div>
  `;
}

function gefilterteStoffRows(){
  let rows = state.stoff.slice();
  if(stoffFilterFach) rows = rows.filter(r => r.fach === stoffFilterFach);
  if(stoffFilterKlasse) rows = rows.filter(r => r.klasseId === stoffFilterKlasse);
  if(stoffFilterVon) rows = rows.filter(r => r.datum >= stoffFilterVon);
  if(stoffFilterBis) rows = rows.filter(r => r.datum <= stoffFilterBis);
  return rows;
}

function renderStoffZusammenfassung(){
  if(!stoffFilterVon && !stoffFilterBis) return '';
  const rows = gefilterteStoffRows();
  const tage = new Set(rows.map(r => r.datum)).size;
  const zeitraumText = stoffFilterVon && stoffFilterBis
    ? `${formatDatum(stoffFilterVon)} – ${formatDatum(stoffFilterBis)}`
    : stoffFilterVon ? `ab ${formatDatum(stoffFilterVon)}` : `bis ${formatDatum(stoffFilterBis)}`;
  return `
    <div class="stoff-zusammenfassung">
      <strong>Zeitraum ${zeitraumText}:</strong>
      ${tage} Unterrichtstag${tage === 1 ? '' : 'e'} · ${rows.length} Unterrichtsstunde${rows.length === 1 ? '' : 'n'}
    </div>`;
}

let stoffAddingDatum = null;

function renderStoffTable(){
  let rows = gefilterteStoffRows();

  if(rows.length === 0 && !stoffAddingDatum){
    const gefiltert = stoffFilterFach || stoffFilterKlasse || stoffFilterVon || stoffFilterBis;
    return `<div class="empty-state"><span class="big">${gefiltert ? 'Keine Einträge in diesem Zeitraum' : 'Noch keine Einträge'}</span>${gefiltert ? 'Passe die Filter an oder wähle einen anderen Zeitraum.' : 'Lege oben deinen ersten Stoffverteilungs-Eintrag an.'}</div>`;
  }

  const nachTag = {};
  rows.forEach(r => { (nachTag[r.datum] = nachTag[r.datum] || []).push(r); });
  const tage = Object.keys(nachTag).sort();

  return tage.map(datum => renderTagBlock(datum, nachTag[datum].sort((a,b) => (a.stunde||0) - (b.stunde||0)))).join('');
}

const WOCHENTAGE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function wochentagName(iso){
  return WOCHENTAGE[new Date(iso + 'T00:00:00').getDay()];

/* Wird ausschließlich für die Mehrfach-Erstellung (Doppelstunde am selben Tag) genutzt:
   erzeugt mehrere unabhängige Material-Textfelder (eines je Stunde), die anschließend
   jeweils als eigener Eintrag gespeichert werden. */
function buildBatchMaterialFieldsHtml(vonRaw, bisRaw, prefill){
  const von = parseInt(vonRaw, 10) || 1;
  let bis = bisRaw ? parseInt(bisRaw, 10) : von;
  if(bis < von) bis = von;
  const mehrere = bis > von;
  let out = '';
  for(let s = von; s <= bis; s++){
    const val = (prefill && prefill[s] !== undefined) ? esc(prefill[s]) : '';
    out += `
      <div style="margin-bottom:6px;">
        ${mehrere ? `<div class="hint" style="margin:0 0 2px 0;">${s}. Stunde</div>` : ''}
        <textarea id="stoffMaterial_${s}" style="width:100%;min-height:34px;font-size:12.5px;padding:6px 8px;" placeholder="Material / Thema">${val}</textarea>
      </div>`;
  }
  return out;
}

function createSerie(){
  const fach = document.getElementById('serieFach').value;
  const klasseId = document.getElementById('serieKlasse').value;
  const wochentag = parseInt(document.getElementById('serieWochentag').value, 10);
  const rhythmus = document.getElementById('serieRhythmus').value; // 'woechentlich' | 'a' | 'b'
  const startStr = document.getElementById('serieStart').value;
  const endeStr = document.getElementById('serieEnde').value;
  const stundeVon = parseInt(document.getElementById('serieStundeVon').value, 10);
  const stundeBisRaw = document.getElementById('serieStundeBis').value;
  const stundeBis = stundeBisRaw ? parseInt(stundeBisRaw, 10) : null;
  const einheiten = document.getElementById('serieEinheiten').value.split('\n').map(s => s.trim()).filter(s => s.length > 0);

  if(!fach || !klasseId || !startStr || !endeStr){
    alert('Bitte Fach, Klasse, Startdatum und Enddatum angeben.');
    return;
  }
  if(stundeBis && stundeBis < stundeVon){
    alert('„Bis Stunde" darf nicht vor der Startstunde liegen.');
    return;
  }
  const start = new Date(startStr + 'T00:00:00');
  const ende = new Date(endeStr + 'T00:00:00');
  if(ende < start){
    alert('Das Enddatum darf nicht vor dem Startdatum liegen.');
    return;
  }

  // ersten passenden Wochentag ab Startdatum finden
  let datum = new Date(start);
  while(datum.getDay() !== wochentag){
    datum = addTage(datum, 1);
  }

  const schrittTage = rhythmus === 'woechentlich' ? 7 : 14;
  // B-Woche beginnt eine Woche nach der A-Woche, damit A- und B-Serien sich abwechseln
  if(rhythmus === 'b'){
    datum = addTage(datum, 7);
  }
  const serienWoche = rhythmus === 'woechentlich' ? null : (rhythmus === 'a' ? 'A' : 'B');

  const serienId = uid();
  let erstellt = 0;
  let uebersprungen = 0;
  let einheitIndex = 0;

  while(datum <= ende){
    const iso = toISODate(datum);
    if(istSchulfrei(iso)){
      uebersprungen++;
    } else {
      const bis = stundeBis && stundeBis > stundeVon ? stundeBis : stundeVon;
      for(let s = stundeVon; s <= bis; s++){
        state.stoff.push({
          id: uid(),
          datum: iso,
          fach,
          klasseId,
          stunde: s,
          material: s === stundeVon ? (einheiten[einheitIndex] || '') : '',
          serienId,
          serienWoche
        });
      }
      einheitIndex++;
      erstellt++;
    }
    datum = addTage(datum, schrittTage);
  }

  if(erstellt === 0){
    alert('In diesem Zeitraum liegt an dem gewählten Wochentag/Rhythmus kein einziger Schultag (alles Ferien/Feiertage).');
    return;
  }

  saveState();
  showTab('stoffuebersicht');
  alert(`${erstellt} Termin(e) angelegt.${uebersprungen > 0 ? ' ' + uebersprungen + ' Termin(e) wegen Ferien/Feiertagen übersprungen.' : ''}`);
}

// Präzise Altersberechnung anhand des vollständigen Geburtsdatums (berücksichtigt,
// ob der Geburtstag im laufenden Jahr bereits war). Für ältere Einträge, bei denen
// nur ein Geburtsjahr hinterlegt wurde, wird als Näherung weiterhin nur das Jahr genutzt.
function berechneAlter(geburtsdatum){
  const heute = new Date();
  const geb = new Date(geburtsdatum + 'T00:00:00');
  if(isNaN(geb.getTime())) return null;
  let alter = heute.getFullYear() - geb.getFullYear();
  const monatDiff = heute.getMonth() - geb.getMonth();
  if(monatDiff < 0 || (monatDiff === 0 && heute.getDate() < geb.getDate())){
    alter--;
  }
  return alter;
}

function formatAlter(s){
  if(s.geburtsdatum){
    const alter = berechneAlter(s.geburtsdatum);
    if(alter === null || alter < 0 || alter > 100) return '<span class="hint">—</span>';
    return `<span title="geboren am ${formatDatum(s.geburtsdatum)}">${alter} J.</span>`;
  }
  if(s.geburtsjahr){
    const alter = new Date().getFullYear() - parseInt(s.geburtsjahr, 10);
    if(isNaN(alter) || alter < 0 || alter > 100) return '<span class="hint">—</span>';
    return `<span title="nur Geburtsjahr hinterlegt, daher ungenau">≈ ${alter} J.</span>`;
  }
  return '<span class="hint">—</span>';
}

            <span class="class-pill ${k.id===aktiveKlasseId?'active':''}" onclick="aktiveKlasseId='${k.id}'; renderKlassen();">
              ${esc(k.name)}

            </span>`).join('')}
      </div>
    </div>

    ${aktiveKlasseId ? renderSchuelerCard() : ''}
  `;
}

function addKlasse(){
  const input = document.getElementById('newKlasseInput');
  const name = input.value.trim();
  if(!name) return;
  if(state.klassen.some(k => k.name.toLowerCase() === name.toLowerCase())){
    alert('Diese Klasse existiert bereits.');
    return;
  }
  const k = {id: uid(), name};
  state.klassen.push(k);
  aktiveKlasseId = k.id;
  saveState();
  renderKlassen();
}

function deleteKlasse(id){
  const anzahl = state.schueler.filter(s => s.klasseId === id).length;
  const msg = anzahl > 0
    ? `Diese Klasse hat ${anzahl} Schüler:in(nen). Beim Löschen werden auch alle Schüler, Noten sowie zugehörige Raster-/Kann-Listen-Daten dieser Klasse entfernt. Fortfahren?`
    : 'Klasse wirklich löschen?';
  if(!confirm(msg)) return;

  const schuelerIds = state.schueler.filter(s => s.klasseId === id).map(s => s.id);
  state.schueler = state.schueler.filter(s => s.klasseId !== id);
  state.noten = state.noten.filter(n => !schuelerIds.includes(n.schuelerId));
  state.notenSpalten = state.notenSpalten.filter(s => s.klasseId !== id);
  state.abwesenheiten = state.abwesenheiten.filter(a => !schuelerIds.includes(a.schuelerId));
  state.stoff = state.stoff.filter(s => s.klasseId !== id);
  state.kompetenzraster = state.kompetenzraster.filter(r => r.klasseId !== id);
  state.kannlisten = state.kannlisten.filter(l => l.klasseId !== id);
  state.klassen = state.klassen.filter(k => k.id !== id);
  if(aktiveKlasseId === id) aktiveKlasseId = null;
  saveState();
  renderKlassen();
}

function saveSchueler(){
  const nachname = document.getElementById('schNachname').value.trim();

  if(!nachname || !vorname){

  if(geburtsdatum && new Date(geburtsdatum) > new Date()){

  }

  if(schuelerEditingId){

}

}

function cancelSchuelerEdit(){

}

function deleteSchueler(id){
  if(!confirm('Schüler:in wirklich löschen? Zugehörige Noten und Abwesenheiten werden ebenfalls entfernt.')) return;

  renderKlassen();
}

/* ===================== ABWESENHEITEN ===================== */
let abwesenheitKlasseId = null;
let abwesenheitDatum = todayISO();
let abwesenheitSchuljahrId = null;

function abwesenheitSchuljahr(){
  const aktuell = aktuellesSchuljahr();
  if(abwesenheitSchuljahrId && state.schuljahre.some(s => s.id === abwesenheitSchuljahrId)){
    return state.schuljahre.find(s => s.id === abwesenheitSchuljahrId);
  }
  abwesenheitSchuljahrId = aktuell ? aktuell.id : (state.schuljahre[0] && state.schuljahre[0].id);
  return state.schuljahre.find(s => s.id === abwesenheitSchuljahrId) || null;
}

function abwesenheitEintrag(schuelerId, datum){
  return state.abwesenheiten.find(a => a.schuelerId === schuelerId && a.datum === datum);
}

function setAbwesenheit(schuelerId, feld, wert){
  let eintrag = abwesenheitEintrag(schuelerId, abwesenheitDatum);
  if(feld === 'status' && wert === 'anwesend'){
    state.abwesenheiten = state.abwesenheiten.filter(a => !(a.schuelerId === schuelerId && a.datum === abwesenheitDatum));
    saveState();
    renderAbwesenheiten();
    return;
  }
  if(!eintrag){
    eintrag = {id:uid(), schuelerId, datum:abwesenheitDatum, status:'entschuldigt', stunden:1, minuten:0, notiz:''};
    state.abwesenheiten.push(eintrag);
  }
  if(feld === 'stunden') eintrag.stunden = Math.max(0, Math.min(12, Number(wert) || 0));
  else if(feld === 'minuten') eintrag.minuten = Math.max(0, Math.min(600, Number(wert) || 0));
  else eintrag[feld] = wert;
  saveState();
  if(feld === 'status') renderAbwesenheiten();
}

function abwesenheitWerte(schuelerId, schuljahr){
  const liste = state.abwesenheiten.filter(a => a.schuelerId === schuelerId && (!schuljahr || (a.datum >= schuljahr.von && a.datum <= schuljahr.bis)));
  const entschuldigt = liste.filter(a => a.status === 'entschuldigt');
  const unentschuldigt = liste.filter(a => a.status === 'unentschuldigt');
  const verspaetet = liste.filter(a => a.status === 'verspaetet');
  const tage = arr => new Set(arr.map(a => a.datum)).size;
  const stunden = arr => arr.reduce((sum,a) => sum + (Number(a.stunden) || 0), 0);
  return {liste, entschuldigtTage:tage(entschuldigt), entschuldigtStunden:stunden(entschuldigt), unentschuldigtTage:tage(unentschuldigt), unentschuldigtStunden:stunden(unentschuldigt), verspaetungen:verspaetet.length, minuten:verspaetet.reduce((sum,a)=>sum+(Number(a.minuten)||0),0)};
}

function renderAbwesenheiten(){
  const el = document.getElementById('panel-abwesenheit');
  if(!el) return;
  if(abwesenheitKlasseId && !state.klassen.some(k => k.id === abwesenheitKlasseId)) abwesenheitKlasseId = null;
  if(!abwesenheitKlasseId && state.klassen.length) abwesenheitKlasseId = state.klassen.slice().sort((a,b)=>a.name.localeCompare(b.name,'de'))[0].id;
  const sj = abwesenheitSchuljahr();
  const schueler = abwesenheitKlasseId ? schuelerOfKlasse(abwesenheitKlasseId) : [];
  const gesamt = schueler.reduce((sum,s) => {const w=abwesenheitWerte(s.id,sj);sum.e+=w.entschuldigtStunden;sum.u+=w.unentschuldigtStunden;sum.v+=w.verspaetungen;sum.m+=w.minuten;return sum;},{e:0,u:0,v:0,m:0});
  el.innerHTML = `
    <div class="card no-print">
      <div class="toolbar"><div><h2 style="margin:0;">Abwesenheiten erfassen</h2><p class="hint">Anwesenheit und Fehlzeiten werden ausschließlich lokal auf diesem Gerät gespeichert.</p></div>
        <div><button class="btn btn-outline" onclick="downloadSchuelerVorlage()">↓ CSV-Vorlage</button> <button class="btn btn-primary" onclick="document.getElementById('schuelerCsvImport').click()">↑ Schüler importieren</button><input id="schuelerCsvImport" type="file" accept=".csv,text/csv" hidden onchange="importSchuelerCsv(event)"></div>
      </div>
      <div class="absence-controls">
        <div class="field"><label>Klasse</label><select onchange="abwesenheitKlasseId=this.value;renderAbwesenheiten()">${klasseOptions(abwesenheitKlasseId)}</select></div>
        <div class="field"><label>Datum</label><input type="date" value="${abwesenheitDatum}" onchange="abwesenheitDatum=this.value;renderAbwesenheiten()"></div>
        <div class="field"><label>Auswertung</label><select onchange="abwesenheitSchuljahrId=this.value;renderAbwesenheiten()">${state.schuljahre.map(y=>`<option value="${y.id}" ${sj&&sj.id===y.id?'selected':''}>Schuljahr ${esc(y.bezeichnung)}</option>`).join('')}</select></div>
        <button class="btn btn-outline" onclick="exportAbwesenheitenCsv()">↓ Auswertung als CSV</button>
        <button class="btn btn-gold" onclick="window.print()">⎙ Drucken</button>
      </div>
    </div>
    ${!state.klassen.length ? '<div class="card"><div class="empty-state"><span class="big">Noch keine Klasse</span>Importiere eine CSV-Datei oder lege unter „Klassen & Schüler“ eine Klasse an.</div></div>' : `
    <div class="card">
      <h2>Tagesliste — ${esc(klasseName(abwesenheitKlasseId))} · ${formatDatum(abwesenheitDatum)}</h2>
      ${!schueler.length ? '<div class="empty-state">In dieser Klasse sind noch keine Schüler:innen vorhanden.</div>' : `<div class="absence-table-wrap"><table><thead><tr><th>Schüler:in</th><th>Status</th><th>Fehlstunden</th><th>Verspätung (Min.)</th><th>Bemerkung</th></tr></thead><tbody>${schueler.map(s=>{
        const a=abwesenheitEintrag(s.id,abwesenheitDatum);const status=a?a.status:'anwesend';return `<tr><td><strong>${esc(s.nachname)}, ${esc(s.vorname)}</strong></td><td><select class="absence-status" onchange="setAbwesenheit('${s.id}','status',this.value)"><option value="anwesend" ${status==='anwesend'?'selected':''}>Anwesend</option><option value="entschuldigt" ${status==='entschuldigt'?'selected':''}>Entschuldigt</option><option value="unentschuldigt" ${status==='unentschuldigt'?'selected':''}>Unentschuldigt</option><option value="verspaetet" ${status==='verspaetet'?'selected':''}>Verspätet</option></select></td><td><input type="number" min="0" max="12" step="1" value="${a&&a.stunden||0}" ${status==='anwesend'||status==='verspaetet'?'disabled':''} onchange="setAbwesenheit('${s.id}','stunden',this.value)" style="width:85px"></td><td><input type="number" min="0" max="600" step="1" value="${a&&a.minuten||0}" ${status!=='verspaetet'?'disabled':''} onchange="setAbwesenheit('${s.id}','minuten',this.value)" style="width:95px"></td><td><input class="absence-note" value="${a?esc(a.notiz):''}" ${status==='anwesend'?'disabled':''} onchange="setAbwesenheit('${s.id}','notiz',this.value)" placeholder="optional"></td></tr>`}).join('')}</tbody></table></div>`}
    </div>
    <div class="card">
      <h2>Schuljahresauswertung — ${esc(klasseName(abwesenheitKlasseId))}${sj?' · '+esc(sj.bezeichnung):''}</h2>
      <div class="absence-summary"><div class="absence-stat"><strong>${gesamt.e}</strong>entschuldigte Stunden</div><div class="absence-stat"><strong class="${gesamt.u?'absence-warning':''}">${gesamt.u}</strong>unentschuldigte Stunden</div><div class="absence-stat"><strong>${gesamt.v}</strong>Verspätungen</div><div class="absence-stat"><strong>${gesamt.m}</strong>Minuten verspätet</div></div>
      ${!schueler.length?'':`<div class="absence-table-wrap"><table><thead><tr><th>Schüler:in</th><th>Entschuldigt</th><th>Unentschuldigt</th><th>Verspätungen</th><th>Minuten</th></tr></thead><tbody>${schueler.map(s=>{const w=abwesenheitWerte(s.id,sj);return `<tr><td><strong>${esc(s.nachname)}, ${esc(s.vorname)}</strong></td><td>${w.entschuldigtTage} Tage / ${w.entschuldigtStunden} Std.</td><td class="${w.unentschuldigtStunden?'absence-warning':''}">${w.unentschuldigtTage} Tage / ${w.unentschuldigtStunden} Std.</td><td>${w.verspaetungen}</td><td>${w.minuten}</td></tr>`}).join('')}</tbody></table></div>`}
    </div>`}`;
}

function csvZeileTeilen(zeile, trenner){
  const zellen=[];let zelle='',inAnf=false;
  for(let i=0;i<zeile.length;i++){const c=zeile[i];if(c==='"'&&inAnf&&zeile[i+1]==='"'){zelle+='"';i++;}else if(c==='"')inAnf=!inAnf;else if(c===trenner&&!inAnf){zellen.push(zelle.trim());zelle='';}else zelle+=c;}
  zellen.push(zelle.trim());return zellen;
}

function downloadSchuelerVorlage(){
  const text='Klasse;Nachname;Vorname;Geburtsdatum\n7b;Mustermann;Mia;2013-04-18\n7b;Beispiel;Noah;2012-11-03\n';
  const blob=new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='schueler-import-vorlage.csv';a.click();URL.revokeObjectURL(url);
}

async function importSchuelerCsv(event){
  const file=event.target.files[0];if(!file)return;
  try{
    const text=await file.text(),zeilen=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(z=>z.trim());
    if(zeilen.length<2) throw new Error('Die Datei enthält keine Schülerdaten.');
    const trenner=(zeilen[0].match(/;/g)||[]).length >= (zeilen[0].match(/,/g)||[]).length ? ';' : ',';
    const kopf=csvZeileTeilen(zeilen[0],trenner).map(x=>x.toLowerCase().replace(/[\s_-]/g,''));
    const spalte=(...namen)=>namen.map(n=>kopf.indexOf(n)).find(i=>i>=0);
    const ki=spalte('klasse','class'),ni=spalte('nachname','familienname','lastname'),vi=spalte('vorname','firstname'),gi=spalte('geburtsdatum','geburtstag','birthdate');
    if(ki===undefined||ni===undefined||vi===undefined) throw new Error('Benötigte Spalten: Klasse, Nachname und Vorname.');
    let hinzu=0,uebersprungen=0;
    for(const zeile of zeilen.slice(1)){
      const z=csvZeileTeilen(zeile,trenner),klassenname=(z[ki]||'').trim(),nachname=(z[ni]||'').trim(),vorname=(z[vi]||'').trim();
      if(!klassenname||!nachname||!vorname){uebersprungen++;continue;}
      let klasse=state.klassen.find(k=>k.name.toLowerCase()===klassenname.toLowerCase());if(!klasse){klasse={id:uid(),name:klassenname};state.klassen.push(klasse);}
      if(state.schueler.some(s=>s.klasseId===klasse.id&&s.nachname.toLowerCase()===nachname.toLowerCase()&&s.vorname.toLowerCase()===vorname.toLowerCase())){uebersprungen++;continue;}
      state.schueler.push({id:uid(),klasseId:klasse.id,nachname,vorname,geburtsdatum:gi!==undefined&&(z[gi]||'').trim()||null,foerderstatus:'kein Förderbedarf',traeger:'',pflichtschuljahr11:false,anschlussArt:null});hinzu++;
    }
    saveState();abwesenheitKlasseId=null;renderAll();alert(`${hinzu} Schüler:innen importiert. ${uebersprungen} Zeilen wurden übersprungen.`);
  }catch(e){alert('Import fehlgeschlagen: '+e.message);}finally{event.target.value='';}
}

function exportAbwesenheitenCsv(){
  const sj=abwesenheitSchuljahr(),schueler=abwesenheitKlasseId?schuelerOfKlasse(abwesenheitKlasseId):[];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const zeilen=[['Klasse','Nachname','Vorname','Schuljahr','Entschuldigte Tage','Entschuldigte Stunden','Unentschuldigte Tage','Unentschuldigte Stunden','Verspätungen','Minuten verspätet'].map(q).join(';')];
  schueler.forEach(s=>{const w=abwesenheitWerte(s.id,sj);zeilen.push([klasseName(s.klasseId),s.nachname,s.vorname,sj?sj.bezeichnung:'',w.entschuldigtTage,w.entschuldigtStunden,w.unentschuldigtTage,w.unentschuldigtStunden,w.verspaetungen,w.minuten].map(q).join(';'));});
  const blob=new Blob(['\uFEFF'+zeilen.join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Abwesenheiten-${klasseName(abwesenheitKlasseId)}-${sj?sj.bezeichnung:'gesamt'}.csv`.replace(/[\\/:*?"<>|]/g,'_');a.click();URL.revokeObjectURL(url);
}

/* ===================== NOTEN ===================== */
