name: Schulplaner auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Schulplaner bauen und testen
        run: |
          npm test
          npm run build

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website bereitstellen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
